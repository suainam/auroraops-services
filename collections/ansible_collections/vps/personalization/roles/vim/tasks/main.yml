---
# 启用控制变量: auroraops_roles['personalization']['vim'] (定义在 group_vars/all/roles.yml 和 host_vars/)
# 默认: true (如需禁用，在 host_vars 中设置为 false)

- name: 角色启用检查
  ansible.builtin.debug:
    msg: "Role vim is disabled, skipping"
  when: not (auroraops_roles['personalization']['vim'] | default(true) | bool)
  tags: [deploy, personalization, vim, phase2]

- name: 角色已启用，执行 Vim 任务
  ansible.builtin.debug:
    msg: "Executing vim role tasks"
  when: auroraops_roles['personalization']['vim'] | default(true) | bool
  tags: [deploy, personalization, vim, phase2]

- name: Run vim preflight
  ansible.builtin.import_tasks: preflight.yml
  when: auroraops_roles['personalization']['vim'] | default(true) | bool
  tags: [deploy, personalization, vim, phase2]

- name: Apply managed vim changes
  ansible.builtin.import_tasks: apply.yml
  when:
    - auroraops_roles['personalization']['vim'] | default(true) | bool
    - not ansible_check_mode
  tags: [deploy, personalization, vim, phase2]
