---
- name: Check rclone binary on Darwin
  ansible.builtin.command: rclone version
  environment:
    PATH: "{{ ansible_env.PATH | default('') }}:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
  register: rclone_darwin_check
  failed_when: false
  changed_when: false
  tags: [deploy, personalization, rclone, phase2]

- name: Fail if rclone is not installed on Darwin
  ansible.builtin.fail:
    msg: "rclone is not installed or not in PATH on Darwin. Please install via Homebrew ('brew install rclone')."
  when: rclone_darwin_check.rc != 0
  tags: [deploy, personalization, rclone, phase2]

- name: Ensure Darwin Rclone configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ rclone_darwin_config_dir }}"
    - "{{ rclone_darwin_user_config_dir }}"
  tags: [deploy, personalization, rclone, phase2]

- name: Deploy Darwin rclone.conf
  no_log: true
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ rclone_darwin_config_path }}"
    mode: "0600"
  tags: [deploy, personalization, rclone, phase2]

- name: Ensure Darwin WebDAV LaunchAgent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ rclone_webdav_darwin_plist_path | dirname }}"
    - "{{ rclone_webdav_darwin_cache_dir }}"
    - "{{ rclone_webdav_darwin_log_path | dirname }}"
  when: rclone_webdav_enabled | default(false) | bool
  tags: [deploy, personalization, rclone, phase2]

- name: Deploy Darwin WebDAV LaunchAgent plist
  ansible.builtin.template:
    src: com.auroraops.rclone-webdav.plist.j2
    dest: "{{ rclone_webdav_darwin_plist_path }}"
    mode: "0644"
  register: rclone_webdav_darwin_plist_result
  when: rclone_webdav_enabled | default(false) | bool
  tags: [deploy, personalization, rclone, phase2]

- name: Reload Darwin WebDAV LaunchAgent when plist changed
  ansible.builtin.shell: |
    launchctl unload "{{ rclone_webdav_darwin_plist_path }}" 2>/dev/null || true
    launchctl load -w "{{ rclone_webdav_darwin_plist_path }}"
  args:
    executable: /bin/bash
  when:
    - rclone_webdav_enabled | default(false) | bool
    - rclone_webdav_darwin_plist_result.changed
  tags: [deploy, personalization, rclone, phase2]
