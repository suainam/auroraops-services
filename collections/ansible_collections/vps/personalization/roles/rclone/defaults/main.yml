---
rclone_include_user_configs: true

# Rclone configuration file path
rclone_config_path: "/root/.config/rclone/rclone.conf"
rclone_config_dir: "{{ rclone_config_path | dirname }}"
rclone_user_config_dir: "{{ rclone_config_dir }}/rclone.conf.d"
rclone_darwin_config_path: "{{ (ansible_env.HOME | default('~')) }}/.config/rclone/rclone.conf"
rclone_darwin_config_dir: "{{ rclone_darwin_config_path | dirname }}"
rclone_darwin_user_config_dir: "{{ rclone_darwin_config_dir }}/rclone.conf.d"

# Cloud backup prefix
rclone_backup_path_prefix: ""

# Proxy configuration
rclone_use_proxy: "{{ proxy_enabled | default(false) }}"
rclone_http_proxy: "{{ proxy_http | default('') }}"
rclone_https_proxy: "{{ proxy_https | default('') }}"

# Secrets from Vault
rclone_onedrive_token: "{{ vault_rclone_onedrive_token }}"
rclone_onedrive_drive_id: "{{ vault_rclone_onedrive_drive_id }}"
rclone_gdrive_token: "{{ vault_rclone_gdrive_token }}"
rclone_gdrive_client_id: "{{ vault_rclone_gdrive_client_id | default('') }}"
rclone_gdrive_client_secret: "{{ vault_rclone_gdrive_client_secret | default('') }}"

# WebDAV Gateway Daemon configuration
rclone_webdav_enabled: false
rclone_webdav_remote: "gdrive:"
rclone_webdav_addr: "127.0.0.1:5244"
rclone_webdav_vfs_cache_mode: "writes"
rclone_webdav_cache_max_size: "10G"
rclone_webdav_cache_max_age: "2h"
rclone_webdav_dir_cache_time: "15m"
rclone_webdav_poll_interval: "1m"
rclone_webdav_buffer_size: "32M"
rclone_webdav_read_chunk_size: "32M"
rclone_webdav_read_chunk_size_limit: "256M"
rclone_webdav_log_level: "NOTICE"
rclone_webdav_darwin_launchagent_label: "com.auroraops.rclone-webdav"
rclone_webdav_darwin_plist_path: "{{ (ansible_env.HOME | default('~')) }}/Library/LaunchAgents/{{ rclone_webdav_darwin_launchagent_label }}.plist"
rclone_webdav_darwin_cache_dir: "{{ (ansible_env.HOME | default('~')) }}/Library/Caches/rclone-webdav"
rclone_webdav_darwin_log_path: "{{ (ansible_env.HOME | default('~')) }}/Library/Logs/rclone-webdav.log"
rclone_webdav_linux_service_name: "rclone-webdav"
rclone_webdav_linux_cache_dir: "/var/cache/rclone-webdav"
