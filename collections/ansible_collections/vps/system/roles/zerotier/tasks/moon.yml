---
- name: Check if moon configuration exists
  become: true
  ansible.builtin.stat:
    path: /var/lib/zerotier-one/moon.json
  register: zerotier_moon_json_file
  tags: [deploy, system, zerotier, phase2]

- name: Initialize Moon configuration
  become: true
  ansible.builtin.shell: zerotier-idtool initmoon identity.public > moon.json
  args:
    chdir: /var/lib/zerotier-one
    creates: /var/lib/zerotier-one/moon.json
  when: not zerotier_moon_json_file.stat.exists
  tags: [deploy, system, zerotier, phase2]

- name: Read Moon configuration
  become: true
  ansible.builtin.slurp:
    src: /var/lib/zerotier-one/moon.json
  register: zerotier_moon_config_b64
  tags: [deploy, system, zerotier, phase2]

- name: Parse Moon configuration
  ansible.builtin.set_fact:
    zerotier_moon_config: "{{ zerotier_moon_config_b64['content'] | b64decode | from_json }}"
  tags: [deploy, system, zerotier, phase2]

- name: Determine Public IP for Moon
  ansible.builtin.set_fact:
    zerotier_moon_public_ip: "{{ ansible_host | default(ansible_default_ipv4.address) }}"
  when: zerotier_moon_public_ip is not defined
  tags: [deploy, system, zerotier, phase2]

- name: Update Moon configuration with stable endpoints
  become: true
  ansible.builtin.copy:
    content: >-
      {{ zerotier_moon_config
         | combine({'roots': [zerotier_moon_config['roots'][0]
         | combine({'stableEndpoints': [zerotier_moon_public_ip ~ '/' ~ zerotier_port]})]})
         | to_nice_json }}
    dest: /var/lib/zerotier-one/moon.json
    mode: "0644"
  notify: Generate Moon file
  tags: [deploy, system, zerotier, phase2]

- name: Create moons.d directory
  become: true
  ansible.builtin.file:
    path: /var/lib/zerotier-one/moons.d
    state: directory
    mode: "0755"
  tags: [deploy, system, zerotier, phase2]

- name: Trigger Moon generation immediate
  ansible.builtin.meta: flush_handlers
  tags: [deploy, system, zerotier, phase2]

- name: Get Moon World ID
  ansible.builtin.set_fact:
    zerotier_moon_world_id: "{{ zerotier_moon_config['id'] }}"
  tags: [deploy, system, zerotier, phase2]

- name: Display Moon connection instructions
  ansible.builtin.pause:
    seconds: 10
    prompt: |
      **********************************************************
      *        ZeroTier Moon Configuration Complete!           *
      **********************************************************

      Moon World ID: {{ zerotier_moon_world_id }}

      To connect other clients to this Moon, run:

          zerotier-cli orbit {{ zerotier_moon_world_id }} {{ zerotier_moon_world_id }}

      (Continuing in 10 seconds...)
      **********************************************************
  tags: [deploy, system, zerotier, phase2]
