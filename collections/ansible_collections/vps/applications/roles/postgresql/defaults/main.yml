---
postgresql_version: "17"
postgresql_port: 5432
postgresql_data_directory_path: "/var/lib/postgresql/{{ postgresql_version }}/main"
postgresql_listen_addresses: "localhost"

# Encoding and Timezone
postgresql_encoding: "UTF8"
postgresql_timezone: "Asia/Shanghai"
postgresql_lc_collate: "en_US.UTF-8"
postgresql_lc_ctype: "en_US.UTF-8"

# Resource limits
postgresql_shared_buffers: "256MB"
postgresql_work_mem: "4MB"
postgresql_maintenance_work_mem: "64MB"
postgresql_max_connections: "50"

# Database and user configuration
postgresql_app_db_name: "app_db"
postgresql_app_db_user: "admin"

# pg_hba.conf entries
postgresql_pg_hba_entries:
  - { type: "local", database: "all", user: "{{ postgresql_app_db_user }}", auth_method: "scram-sha-256" } # admin 用户优先使用密码认证
  - { type: "local", database: "all", user: "postgres", auth_method: "peer" } # postgres 用户使用 peer 认证
  - { type: "host", database: "all", user: "all", address: "127.0.0.1/32", auth_method: "scram-sha-256" }
  - { type: "host", database: "all", user: "all", address: "::1/128", auth_method: "scram-sha-256" }

# Logging configuration (coordinated with logrotate)
postgresql_log_destination: "stderr"
postgresql_logging_collector: "on"
postgresql_log_directory: "pg_log"
postgresql_log_filename: "postgresql-%Y-%m-%d_%H%M%S.log"

# Optional role-local Logrotate configuration
postgresql_logrotate_enabled: true
postgresql_logrotate_config_path: "/etc/logrotate.d/postgresql-common"
postgresql_logrotate_legacy_paths:
  - "/etc/logrotate.d/postgresql"
postgresql_logrotate_config:
  log_path: "/var/log/postgresql/*.log"
  interval: daily
  rotate_count: 7
  compress: true
  delaycompress: true
  missingok: true
  notifempty: true
  su_owner: root
  su_group: root
  nocreate: true
  copytruncate: true

# Vault variables (will be overridden by secrets/vault.yml)
# postgresql_root_password: ""
# postgresql_db_admin_password: ""
