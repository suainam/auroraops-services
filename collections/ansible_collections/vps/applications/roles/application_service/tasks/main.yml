---
- name: Delegate to managed_service universal task library
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../../../../common/tasks/managed_service.yml"
  vars:
    service_name: "{{ app_service_name | default(application_service_name | default('')) }}"
    service_description: "{{ app_service_description | default(application_service_description | default('')) }}"
    service_exec_start: "{{ app_service_exec_start | default(application_service_exec_start | default('')) }}"
    service_user: "{{ app_service_user | default(application_service_user | default('root')) }}"
    service_group: "{{ app_service_group | default(application_service_group | default('root')) }}"
    service_type: "{{ app_service_type | default(application_service_type | default('simple')) }}"
    service_restart: "{{ app_service_restart | default(application_service_restart | default('on-failure')) }}"
    service_restart_sec: "{{ app_service_restart_sec | default(application_service_restart_sec | default(5)) }}"
    service_working_directory: "{{ app_service_working_directory | default(application_service_working_directory | default('')) }}"
    service_environment_file: "{{ app_service_environment_file | default(application_service_environment_file | default('')) }}"
    service_environment: "{{ app_service_environment | default(application_service_environment | default({})) }}"
    service_state: "{{ app_service_state | default(application_service_state | default('started')) }}"
    service_enabled: "{{ app_service_enabled | default(application_service_enabled | default(true)) }}"
