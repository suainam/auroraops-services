---
# Canonical role-prefixed variables. Legacy app_service_* inputs remain supported
# so existing include_role callers do not need to change in this lint-only patch.

application_service_name: "{{ app_service_name | default('') }}"
application_service_description: "{{ app_service_description | default('Generic Application Service') }}"
application_service_user: "{{ app_service_user | default('') }}"
application_service_group: "{{ app_service_group | default(none) }}"
application_service_working_directory: "{{ app_service_working_directory | default('') }}"
application_service_environment_file: "{{ app_service_environment_file | default('') }}"
application_service_exec_start: "{{ app_service_exec_start | default('') }}"
application_service_exec_pre: "{{ app_service_exec_pre | default('') }}"
application_service_exec_post: "{{ app_service_exec_post | default('') }}"
application_service_exec_stop: "{{ app_service_exec_stop | default('') }}"
application_service_exec_stop_post: "{{ app_service_exec_stop_post | default('') }}"
application_service_exec_reload: "{{ app_service_exec_reload | default('') }}"
application_service_type: "{{ app_service_type | default('simple') }}"
application_service_timeout: "{{ app_service_timeout | default('') }}"
application_service_timeout_stop_sec: "{{ app_service_timeout_stop_sec | default('') }}"
application_service_restart_on_change: "{{ app_service_restart_on_change | default(true) }}"
application_service_restart: "{{ app_service_restart | default('on-failure') }}"
application_service_restart_sec: "{{ app_service_restart_sec | default('') }}"
application_service_kill_mode: "{{ app_service_kill_mode | default('') }}"
application_service_kill_signal: "{{ app_service_kill_signal | default('') }}"
application_service_standard_output: "{{ app_service_standard_output | default('') }}"
application_service_standard_error: "{{ app_service_standard_error | default('') }}"
application_service_environment: "{{ app_service_environment | default({}) }}"
application_service_dependencies: "{{ app_service_dependencies | default([]) }}"
application_service_requires: "{{ app_service_requires | default([]) }}"
application_service_enabled: "{{ app_service_enabled | default(true) }}"
application_service_state: "{{ app_service_state | default('started') }}"
application_service_app_service_state: "{{ app_service_state | default('started') }}"
