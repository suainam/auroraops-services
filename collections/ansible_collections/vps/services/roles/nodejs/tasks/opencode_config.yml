---
# =============================================================================
# OpenCode Configuration (opencode_config)
# =============================================================================
# Configure OpenCode for root and admin users
# Requires: opencode installed via opencode_install task
#
# Configuration loading order:
#   1. vars/opencode_base.yml (base config)
#   2. vars/opencode_providers.yml (universal providers)
#   3. vars/opencode_mcp.yml (universal MCP servers)
#   4. host_vars/<host>.yml (personal config: landian, etc.)

- name: Load OpenCode base configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/opencode_base.yml"
  tags: [deploy, services, nodejs, opencode_config, phase3]

- name: Load providers configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/opencode_providers.yml"
  tags: [deploy, services, nodejs, opencode_config, phase3]

- name: Load MCP configuration
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/opencode_mcp.yml"
  tags: [deploy, services, nodejs, opencode_config, phase3]

- name: Merge providers into base config
  ansible.builtin.set_fact:
    nodejs_opencode_base_config: "{{ nodejs_opencode_base_config | combine({'provider': nodejs_opencode_providers}, recursive=True) }}"
  tags: [deploy, services, nodejs, opencode_config, phase3]

- name: Merge MCP configuration into base config
  ansible.builtin.set_fact:
    nodejs_opencode_base_config: "{{ nodejs_opencode_base_config | combine({'mcp': nodejs_opencode_mcp}, recursive=True) }}"
  tags: [deploy, services, nodejs, opencode_config, phase3]

- name: Merge personal configuration
  ansible.builtin.set_fact:
    nodejs_opencode_base_config: >-
      {{
        nodejs_opencode_base_config
        | combine(nodejs_opencode_personal_config, recursive=True)
      }}
  when: nodejs_opencode_personal_enabled | bool
  tags: [deploy, services, nodejs, opencode_config, phase3]

- name: Ensure .config/opencode directory exists for root
  ansible.builtin.file:
    path: "{{ nodejs_opencode_config_dir_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [deploy, services, nodejs, opencode_config, phase3]

- name: Install context-mode MCP tool
  community.general.npm:
    name: context-mode
    global: true
    state: present
  when: opencode_mcp_context_mode_enabled | default(false) | bool
  tags: [deploy, services, nodejs, opencode_config, phase3]

- name: Deploy opencode.json for root
  ansible.builtin.template:
    src: opencode.json.j2
    dest: "{{ nodejs_opencode_config_dir_root }}/opencode.json"
    owner: root
    group: root
    mode: "0644"
    backup: true
  tags: [deploy, services, nodejs, opencode_config, phase3]

- name: Ensure .config/opencode directory exists for admin
  ansible.builtin.file:
    path: "{{ nodejs_opencode_config_dir_admin }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  when: admin_user is defined
  tags: [deploy, services, nodejs, opencode_config, phase3]

- name: Deploy opencode.json for admin
  ansible.builtin.template:
    src: opencode.json.j2
    dest: "{{ nodejs_opencode_config_dir_admin }}/opencode.json"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
    backup: true
  when: admin_user is defined
  tags: [deploy, services, nodejs, opencode_config, phase3]
