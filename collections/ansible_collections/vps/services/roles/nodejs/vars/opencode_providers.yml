---
# =============================================================================
# OpenCode Providers Configuration (Universal)
# =============================================================================
# This file contains provider configurations that are common across all hosts.
# These configurations are loaded via include_vars in opencode_config.yml.
#
# For host-specific providers (e.g., landian), use nodejs_opencode_personal_config
# in host_vars/<host>.yml under the provider key.
#
# Source: Extracted from /root/.config/opencode/opencode.json
# Last updated: 2026-02-11

nodejs_opencode_providers:
  google:
    name: "Google"
    models:
      # Antigravity Claude Models
      antigravity-claude-opus-4-5-thinking:
        name: "Claude Opus 4.5 Thinking (Antigravity)"
        limit:
          context: 200000
          output: 64000
        modalities:
          input:
            - text
            - image
            - pdf
          output:
            - text
        variants:
          low:
            thinkingConfig:
              thinkingBudget: 8192
          max:
            thinkingConfig:
              thinkingBudget: 32768

      antigravity-claude-sonnet-4-5:
        name: "Claude Sonnet 4.5 (Antigravity)"
        limit:
          context: 200000
          output: 64000
        modalities:
          input:
            - text
            - image
            - pdf
          output:
            - text

      antigravity-claude-sonnet-4-5-thinking:
        name: "Claude Sonnet 4.5 Thinking (Antigravity)"
        limit:
          context: 200000
          output: 64000
        modalities:
          input:
            - text
            - image
            - pdf
          output:
            - text
        variants:
          low:
            thinkingConfig:
              thinkingBudget: 8192
          max:
            thinkingConfig:
              thinkingBudget: 32768

      # Antigravity Gemini Models
      antigravity-gemini-3-flash:
        name: "Gemini 3 Flash (Antigravity)"
        limit:
          context: 1048576
          output: 65536
        modalities:
          input:
            - text
            - image
            - pdf
          output:
            - text
        variants:
          minimal:
            thinkingLevel: "minimal"
          low:
            thinkingLevel: "low"
          medium:
            thinkingLevel: "medium"
          high:
            thinkingLevel: "high"

      antigravity-gemini-3.1-pro:
        name: "Gemini 3.1 Pro (Antigravity)"
        limit:
          context: 1048576
          output: 65535
        modalities:
          input:
            - text
            - image
            - pdf
          output:
            - text
        # Omit thinkingLevel to use upstream dynamic thinking ("auto").
        variants:
          low:
            thinkingLevel: "low"
          high:
            thinkingLevel: "high"

      # Gemini CLI Models
      gemini-2.5-flash:
        name: "Gemini 2.5 Flash (Gemini CLI)"
        limit:
          context: 1048576
          output: 65536
        modalities:
          input:
            - text
            - image
            - pdf
          output:
            - text

      gemini-2.5-pro:
        name: "Gemini 2.5 Pro (Gemini CLI)"
        limit:
          context: 1048576
          output: 65536
        modalities:
          input:
            - text
            - image
            - pdf
          output:
            - text

      gemini-3-flash-preview:
        name: "Gemini 3 Flash Preview (Gemini CLI)"
        limit:
          context: 1048576
          output: 65536
        modalities:
          input:
            - text
            - image
            - pdf
          output:
            - text

      gemini-3-pro-preview:
        name: "Gemini 3 Pro Preview (Gemini CLI)"
        limit:
          context: 1048576
          output: 65535
        modalities:
          input:
            - text
            - image
            - pdf
          output:
            - text
