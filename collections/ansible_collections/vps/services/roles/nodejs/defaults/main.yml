---
# Node.js version (NodeSource format)
nodejs_version: "22.x"
nodejs_install_npm_user: "root"

# ===========================================
# Nodejs npm 全局包管理 - 分层变量
# ===========================================
# 变量优先级（从高到低）:
#   1. host_vars/<host>.yml (主机特定)
#   2. group_vars/all/nodejs.yml (全局默认)
#   3. role/defaults/main.yml (技术默认)
#
# 使用规则:
#   - nodejs_packages_global: 所有主机都需要的包
#   - nodejs_packages_host: 主机特定包（在 host_vars 中定义）
#   - nodejs_packages_exclude: 主机排除的包（在 host_vars 中定义）
#   - 最终列表 = global + host - exclude
# ===========================================

# 新变量（分层）
nodejs_packages_global: []
nodejs_packages_host: []
nodejs_packages_exclude: []
# 旧变量（保留兼容，已废弃）
nodejs_npm_global_packages:
  - { name: "@bitwarden/cli", version: "2024.7.2" }

# =============================================================================
# Bitwarden CLI Configuration (nodejs_bw)
# =============================================================================
# Configure and login to Vaultwarden/Bitwarden server
#
# Authentication methods (in order of preference):
#   1. API Key (recommended for 2FA-enabled accounts)
#   2. Password (for accounts without 2FA)
#
# Required secrets in vault.yml:
#   - vault_vaultwarden_user_name: email address
#   - vault_vaultwarden_password: master password
#   - vault_vaultwarden_client_id: API key client_id (optional, for 2FA)
#   - vault_vaultwarden_client_secret: API key client_secret (optional, for 2FA)
#

# Session file path - uses ansible_env.HOME for non-root support
nodejs_bw_server_url: "https://bws.msuai.top"
nodejs_bw_session_file: "{{ ansible_env.HOME | default('/root') }}/.bw_session"

# Credentials from vault
nodejs_bw_email: "{{ vault_vaultwarden_user_name }}"
nodejs_bw_password: "{{ vault_vaultwarden_password }}"
# API Key credentials (for 2FA accounts) - set in vault.yml
nodejs_bw_client_id: "{{ vault_vaultwarden_client_id | default('') }}"
nodejs_bw_client_secret: "{{ vault_vaultwarden_client_secret | default('') }}"

# Test item for lookup plugin verification (optional)
# Set to an existing item name in your vault to test the lookup plugin
nodejs_bw_test_item: "AuroraOps/Database/postgresql"

# =============================================================================
# Vault to Vaultwarden Sync (nodejs_bw_sync)
# =============================================================================
# Sync secrets from vault.yml to Vaultwarden
# Usage: make deploy-services.nodejs.nodejs_bw_sync
#
nodejs_bw_sync_dry_run: false
# 项目根目录 - 使用 ansible_env.HOME 支持非 root 用户
nodejs_bw_sync_project_root: "{{ ansible_env.HOME | default('/root') }}/AuroraOps"

# =============================================================================
# Node.js application variable contracts
# =============================================================================
# Role 内部只消费 nodejs_*；旧 inventory 输入保留单向兼容回退。

# OpenCode
nodejs_opencode_enabled: "{{ opencode_enabled | default(false) }}"
nodejs_opencode_project_enabled: "{{ opencode_project_enabled | default(false) }}"
nodejs_opencode_server_enabled: "{{ opencode_server_enabled | default(false) }}"
nodejs_opencode_antigravity_enabled: >-
