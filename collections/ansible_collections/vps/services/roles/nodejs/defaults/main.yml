nodejs_opencode_config_dir_admin: >-
  {{ opencode_config_dir_admin | default('/home/' ~ admin_user ~ '/.config/opencode') }}
nodejs_opencode_project_dir: "{{ opencode_project_dir | default('/root/AuroraOps') }}"
nodejs_opencode_install_method: "{{ opencode_install_method | default('script') }}"
nodejs_opencode_version: "{{ opencode_version | default('1.1.56') }}"
nodejs_opencode_install_user: "{{ opencode_install_user | default('root') }}"
nodejs_opencode_add_to_path: "{{ opencode_add_to_path | default(true) }}"
nodejs_opencode_server_port: "{{ opencode_server_port | default(4096) }}"
nodejs_opencode_server_hostname: >-
  {{ opencode_server_hostname | default('127.0.0.1') }}
nodejs_opencode_server_user: "{{ opencode_server_user | default('root') }}"
nodejs_opencode_server_working_directory: >-
  {{ opencode_server_working_directory | default('/root') }}
nodejs_opencode_server_binary: >-
  {{ opencode_server_binary | default('/usr/bin/opencode') }}
nodejs_opencode_server_password: "{{ opencode_server_password | default('') }}"
nodejs_opencode_server_service_name: >-
  {{ opencode_server_service_name | default('opencode-server') }}
nodejs_opencode_server_service_description: >-
  {{ opencode_server_service_description | default('OpenCode Headless Server') }}
nodejs_opencode_server_service_enabled: >-
  {{ opencode_server_service_enabled | default(true) }}
nodejs_opencode_server_service_state: >-
  {{ opencode_server_service_state | default('started') }}
nodejs_opencode_server_config: >-
  {{
    opencode_server_config
    | default({
        'port': nodejs_opencode_server_port | string,
        'hostname': nodejs_opencode_server_hostname,
        'mdns': false,
        'cors': []
      })
  }}
nodejs_opencode_personal_enabled: >-
  {{ opencode_personal_enabled | default(false) }}
nodejs_opencode_personal_config: "{{ opencode_personal_config | default({}) }}"

