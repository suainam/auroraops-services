---
# OpenClaw AI Bot Gateway Configuration
# 参考: https://docs.openclaw.ai

# =============================================================================
# OpenClaw Paths
# =============================================================================
nodejs_openclaw_default_user: "root"
nodejs_openclaw_default_home: "/root/.openclaw"
nodejs_openclaw_default_config_dir: "{{ nodejs_openclaw_home }}"

# =============================================================================
# Gateway Configuration
# =============================================================================
nodejs_openclaw_default_gateway_port: 18789
nodejs_openclaw_default_gateway_bind: "loopback"
nodejs_openclaw_default_gateway_mode: "local"

# =============================================================================
# Logging Configuration
# =============================================================================
nodejs_openclaw_default_logging_level: "debug"
nodejs_openclaw_default_logging_redact: "tools"
nodejs_openclaw_default_logging_console_level: "debug"

# =============================================================================
# Model Configuration
# =============================================================================
nodejs_openclaw_default_model_primary: "zai/glm-4.5-air"

nodejs_openclaw_default_model_fallbacks:
  - "zai/glm-4.7-flash"
  - "local-new-api/gemini-2.5-pro"
  - "openrouter/arcee-ai/trinity-large-preview:free"
  - "openrouter/arcee-ai/trinity-mini:free"
  - "openrouter/openrouter/free"
  - "openrouter/google/gemma-3-27b-it:free"
  - "openrouter/meta-llama/llama-3.3-70b-instruct:free"
  - "openrouter/mistralai/mistral-small-3.1-24b-instruct:free"
  - "openrouter/nvidia/nemotron-3-nano-30b-a3b:free"
  - "openrouter/nvidia/nemotron-nano-12b-v2-vl:free"
  - "openrouter/nvidia/nemotron-nano-9b-v2:free"
  - "openrouter/openai/gpt-oss-120b:free"
  - "openrouter/openai/gpt-oss-20b:free"
  - "openrouter/qwen/qwen3-4b:free"
  - "openrouter/qwen/qwen3-coder:free"
  - "openrouter/qwen/qwen3-next-80b-a3b-instruct:free"
  - "openrouter/stepfun/step-3.5-flash:free"
  - "openrouter/upstage/solar-pro-3:free"
  - "openrouter/z-ai/glm-4.5-air:free"
  - "zai/glm-4.5-air"
  - "openrouter/auto"
  - "opencode/glm-5-free"
  - "opencode/minimax-m2.5-free"
  - "opencode/trinity-large-preview-free"

nodejs_openclaw_default_agent_models:
  - id: "zai/glm-4.7-flash"
    alias: "GLM-Flash"
  - id: "zai/glm-4.5-air"
    alias: "GLM"
  - id: "zai/glm-4.7"
    alias: "GLM-4.7"
  - id: "zai/glm-4.7-flashx"
    alias: "GLM-FlashX"
  - id: "zai/glm-5"
    alias: "GLM-5"
  - id: "local-new-api/gemini-2.5-pro"
    alias: "LocalGemini"
  - id: "openrouter/auto"
    alias: "OpenRouter"

# =============================================================================
# Agent Default Configuration
# =============================================================================
nodejs_openclaw_default_agent_max_concurrent: >-
  {{
    (performance.hardware.cpu_cores
    | default(ansible_local.performance.hardware.cpu_cores | default(2)))
    | int * 2
  }}
nodejs_openclaw_default_agent_subagents_max: >-
  {{
    (performance.hardware.cpu_cores
    | default(ansible_local.performance.hardware.cpu_cores | default(2)))
    | int * 4
  }}
nodejs_openclaw_default_agent_compaction_mode: "safeguard"
nodejs_openclaw_default_agent_compaction_threshold: 80000
nodejs_openclaw_default_agent_compaction_target: 60000
nodejs_openclaw_default_agent_workspace: "{{ nodejs_openclaw_home }}/workspace"

# =============================================================================
# Memory Search Configuration (Vector Embeddings)
# =============================================================================
# 使用 Gemini API 做 embedding，对 memory/*.md 做语义向量索引
nodejs_openclaw_default_memory_search_enabled: true
nodejs_openclaw_default_memory_search_provider: "gemini"
nodejs_openclaw_default_memory_search_session_enabled: true

# =============================================================================
# Compaction Memory Flush (会话压缩前自动写记忆)
# =============================================================================
nodejs_openclaw_default_compaction_reserve_floor: 20000
nodejs_openclaw_default_compaction_memory_flush: true
nodejs_openclaw_default_compaction_flush_threshold: 4000

# =============================================================================
# MCP Servers (OpenViking 语义搜索工具)
# =============================================================================
nodejs_openclaw_default_mcp_openviking_enabled: false
nodejs_openclaw_default_mcp_openviking_python: "/root/.local/share/uv/tools/openviking/bin/python"
nodejs_openclaw_default_mcp_openviking_script: "/usr/local/bin/openviking_mcp.py"

# =============================================================================
# Messages Configuration
# =============================================================================
nodejs_openclaw_default_messages_ack_reaction_scope: "group-mentions"

# =============================================================================
# Commands Configuration
# =============================================================================
nodejs_openclaw_default_commands_native: "auto"
nodejs_openclaw_default_commands_native_skills: "auto"

# =============================================================================
# Hooks Configuration
# =============================================================================
nodejs_openclaw_default_hooks_internal_enabled: true
nodejs_openclaw_default_hooks_boot_md: true
nodejs_openclaw_default_hooks_command_logger: true
nodejs_openclaw_default_hooks_session_memory: true

# =============================================================================
# Channels Configuration
# =============================================================================
nodejs_openclaw_default_telegram_enabled: true
nodejs_openclaw_default_telegram_dm_policy: "pairing"
nodejs_openclaw_default_telegram_group_policy: "allowlist"
nodejs_openclaw_default_telegram_stream_mode: "partial"

# openclaw_discord_enabled 在 group_vars 中设置
nodejs_openclaw_default_discord_dm_policy: "pairing"

# =============================================================================
# Skills Configuration
# =============================================================================
nodejs_openclaw_default_skills_node_manager: "npm"

# =============================================================================
# Tailscale Configuration
# =============================================================================
nodejs_openclaw_default_tailscale_mode: "off"
nodejs_openclaw_default_tailscale_reset_on_exit: false

# =============================================================================
# Custom Model Providers Configuration
# =============================================================================
nodejs_openclaw_default_models_mode: "merge"

nodejs_openclaw_default_models_providers:
  - name: "local-new-api"
    baseUrl: "http://localhost:30001/v1"
    apiKey_var: "openclaw_local_new_api_key"
    api: "openai-responses"
    models:
      - id: "gemini-2.5-pro"
        name: "Gemini 2.5 Pro (Local)"
        reasoning: false
        input: ["text"]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 200000
        maxTokens: 8192

  - name: "zai"
    baseUrl: "https://open.bigmodel.cn/api/paas/v4"
    apiKey_var: "openclaw_zai_api_key"
    api: "openai-completions"
    models:
      - id: "glm-4.7-flash"
        name: "GLM-4.7 Flash (Free)"
        reasoning: true
        input: ["text", "image"]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 128000
        maxTokens: 4096
      - id: "glm-5"
        name: "GLM-5"
        reasoning: true
        input: ["text"]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 204800
        maxTokens: 131072
      - id: "glm-4.7"
        name: "GLM-4.7"
        reasoning: true
        input: ["text"]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 204800
        maxTokens: 131072
      - id: "glm-4.7-flashx"
        name: "GLM-4.7 FlashX"
        reasoning: true
        input: ["text"]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 204800
        maxTokens: 131072
      - id: "glm-4.5-air"
        name: "GLM-4.5 Air"
        reasoning: true
        input: ["text", "image"]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 128000
        maxTokens: 4096

  - name: "openrouter"
    baseUrl: "https://openrouter.ai/api/v1"
    apiKey_var: "openclaw_openrouter_api_key"
    api: "openai-responses"
    models:
      - id: "openrouter/auto"
        name: "OpenRouter Auto"
        reasoning: false
        input: ["text"]
        contextWindow: 200000
        maxTokens: 8192
