---
# Hy-Memory PRO Docker Service Tasks
- name: 创建 Hy-Memory 目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_group | default('root') }}"
    mode: '0755'
  loop:
    - "/opt/dockers/hy_memory"
    - "/opt/dockers/hy_memory/data"
  tags: [deploy, services, docker_apps, hy_memory]

- name: 渲染 Hy-Memory Server 脚本
  ansible.builtin.copy:
    dest: "/opt/dockers/hy_memory/server.py"
    content: |
      import os
      import sys
      import logging
      import httpx
      from fastmcp import FastMCP
      from hy_memory import HyMemoryClient
      from starlette.applications import Starlette
      from starlette.responses import JSONResponse
      from starlette.routing import Route
      from starlette.middleware import Middleware
      from starlette.middleware.base import BaseHTTPMiddleware
      import uvicorn

      logging.basicConfig(level=logging.INFO, stream=sys.stderr)
      logger = logging.getLogger("hy_memory_pro")

      os.environ.setdefault("MEMORY_MODE", "pro")
      os.environ.setdefault("MEMORY_ENABLE_GRAPH", "false")
      os.environ.setdefault("MEMORY_EMBEDDER_BASE_URL", "https://openrouter.ai/api/v1")
      os.environ.setdefault("MEMORY_LLM_BASE_URL", "https://openrouter.ai/api/v1")
      os.environ.setdefault("MEMORY_EMBEDDER_MODEL", "qwen/qwen3-embedding-8b")
      os.environ.setdefault("MEMORY_LLM_MODEL", "anthropic/claude-3.5-sonnet")
      os.environ.setdefault("MEMORY_DATA_DIR", "/opt/dockers/hy_memory/data")
      api_key = "{{ vault_openrouter_api_key | default('') }}"
      if api_key:
          os.environ["MEMORY_EMBEDDER_API_KEY"] = api_key
          os.environ["MEMORY_LLM_API_KEY"] = api_key

      bearer_token = api_key if api_key else "hy-memory-secret-token"

      client = None
      init_error = None
      try:
          logger.info("Initializing HyMemoryClient(mode='pro') with MEMORY_ENABLE_GRAPH=false")
          client = HyMemoryClient(mode="pro")
      except Exception as e:
          init_error = str(e)
          logger.warning(f"Failed to initialize HyMemoryClient: {e}")
      mcp = FastMCP("Hy-Memory PRO")

      @mcp.tool()
      async def remember(content: str, repo: str, branch: str = "main") -> str:
          """Store memory with collision-safe repository namespace mapped to SDK user_id."""
          if not repo:
              raise ValueError("repo parameter is mandatory and cannot be empty")
          sanitized_repo = repo.replace('/', '_').replace('-', '_')
          user_id = f"repo_{sanitized_repo}"
          if not client:
              raise RuntimeError(f"HyMemoryClient not initialized: {init_error}")
          try:
              res = client.add(content=content, user_id=user_id, metadata={"branch": branch})
          except Exception as e:
              logger.error(f"HyMemory client add failed: {e}")
              raise RuntimeError(f"HyMemory client add failed: {e}") from e
          return f"Stored successfully under namespace {user_id}. Result: {res}"

      @mcp.tool()
      async def recall(query: str, repo: str) -> str:
          """Recall memories from the repository namespace mapped to SDK user_id."""
          if not repo:
              raise ValueError("repo parameter is mandatory and cannot be empty")
          sanitized_repo = repo.replace('/', '_').replace('-', '_')
          user_id = f"repo_{sanitized_repo}"
          if not client:
              raise RuntimeError(f"HyMemoryClient not initialized: {init_error}")
          try:
              res = client.search(query=query, user_id=user_id)
          except Exception as e:
              logger.error(f"HyMemory client search failed: {e}")
              raise RuntimeError(f"HyMemory client search failed: {e}") from e
          return str(res)

      class AuthMiddleware(BaseHTTPMiddleware):
          async def dispatch(self, request, call_next):
              if request.url.path in ["/healthz", "/docs", "/openapi.json"]:
                  return await call_next(request)
              auth = request.headers.get("Authorization", "")
              expected = f"Bearer {bearer_token}"
              if not auth or auth != expected:
                  return JSONResponse({"error": "Unauthorized / Invalid Bearer Token"}, status_code=401)
              return await call_next(request)

      async def healthz(request):
          if client is None:
              return JSONResponse({"status": "error", "service": "hy-memory-pro", "error": init_error}, status_code=503)
          return JSONResponse({"status": "ok", "service": "hy-memory-pro", "client_ready": True})

      routes = [
          Route("/healthz", healthz),
      ]

      app = Starlette(routes=routes, middleware=[Middleware(AuthMiddleware)])
      if hasattr(mcp, "sse_app"):
          app.mount("/mcp", mcp.sse_app())
      elif hasattr(mcp, "_sse_app"):
          app.mount("/mcp", mcp._sse_app())

      if __name__ == "__main__":
          uvicorn.run(app, host="127.0.0.1", port=30024)
    mode: '0600'
  tags: [deploy, services, docker_apps, hy_memory]

- name: 创建/更新 Hy-Memory 虚拟环境与锁定的 UV 依赖
  ansible.builtin.shell: |
    if [ ! -d "/opt/dockers/hy_memory/venv" ]; then
      python3 -m venv /opt/dockers/hy_memory/venv
    fi
    /root/.local/bin/uv pip install --python /opt/dockers/hy_memory/venv/bin/python "fastmcp>=2.1.0" "hy-memory>=2.0.4" "httpx>=0.27.0"
  args:
    executable: /bin/bash
  tags: [deploy, services, docker_apps, hy_memory]

- name: 创建 Hy-Memory Systemd Service
  ansible.builtin.copy:
    dest: "/etc/systemd/system/hy-memory.service"
    content: |
      [Unit]
      Description=Hy-Memory PRO FastMCP Service
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/dockers/hy_memory
      ExecStart=/opt/dockers/hy_memory/venv/bin/python /opt/dockers/hy_memory/server.py
      Restart=always
      RestartSec=5
      Environment=PYTHONUNBUFFERED=1

      [Install]
      WantedBy=multi-user.target
    mode: '0644'
  notify:
    - 重载 systemd
    - 重启 hy-memory 服务
  tags: [deploy, services, docker_apps, hy_memory]

- name: 确保 Hy-Memory 服务开机自启并运行
  ansible.builtin.systemd:
    name: hy-memory
    enabled: true
    state: started
  tags: [deploy, services, docker_apps, hy_memory]

