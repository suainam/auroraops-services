---
- name: Verify selected Docker app is absent after rollback
  become: true
  community.docker.docker_container_info:
    name: sub_store
  register: docker_apps_rollback_container_info
  changed_when: false
  failed_when: docker_apps_rollback_container_info.exists
  when: rollback_docker_app_name | default('') == 'sub_store'
  no_log: true
  tags:
    - rollback_verify
    - services
    - docker_apps
    - docker_apps_manifest
    - sub_store
    - phase5

- name: Verify workbuddy2api container is absent after rollback
  become: true
  community.docker.docker_container_info:
    name: workbuddy2api
  register: docker_apps_rollback_wb_info
  changed_when: false
  failed_when: docker_apps_rollback_wb_info.exists
  when: rollback_docker_app_name | default('') == 'workbuddy2api'
  no_log: true
  tags: [rollback_verify, services, docker_apps, docker_apps_manifest, workbuddy2api, phase5]

- name: Verify magpie container is absent after rollback
  become: true
  community.docker.docker_container_info:
    name: magpie
  register: docker_apps_rollback_magpie_info
  changed_when: false
  failed_when: docker_apps_rollback_magpie_info.exists
  when: rollback_docker_app_name | default('') == 'magpie'
  no_log: true
  tags: [rollback_verify, services, docker_apps, magpie, phase5]
