---
# ==============================================================================
# Sing-box Docker Deployment (Containerized / Full Mode for Debian/Ubuntu)
# ==============================================================================

- name: Sing-box Docker - Generate Reality Keypair
  become: true
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - "{{ singbox_image }}"
      - generate
      - reality-keypair
  register: docker_apps_singbox_docker_reality_key_gen
  changed_when: true
  no_log: true
  when:
    - not ansible_check_mode
    - not (docker_apps_reality_key_file.stat.exists | default(false))
  tags: [deploy, services, docker_apps, singbox, phase5]

- name: Sing-box Docker - Resolve Reality Key Generator Output
  ansible.builtin.set_fact:
    docker_apps_reality_key_gen: "{{ docker_apps_singbox_docker_reality_key_gen }}"
  when:
    - not ansible_check_mode
    - not (docker_apps_reality_key_file.stat.exists | default(false))
  tags: [deploy, services, docker_apps, singbox, phase5]
