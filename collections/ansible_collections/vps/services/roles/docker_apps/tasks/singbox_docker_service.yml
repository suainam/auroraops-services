---
# ==============================================================================
# Sing-box Docker Post-Render Container Deployment (Containerized Mode)
# ==============================================================================

- name: Sing-box - Deploy Container (Modular)
  become: true
  community.docker.docker_container:
    name: singbox
    image: "{{ singbox_image }}"
    pull: true
    command: run -C /etc/sing-box/
    restart_policy: always
    network_mode: "host"
    env:
      TZ: Asia/Shanghai
    volumes:
      - /opt/dockers/singbox/config:/etc/sing-box/:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/dockers/singbox/web:/var/www/singbox
    capabilities:
      - NET_ADMIN
    oom_score_adj: -999
    cpu_shares: 2048
    memory: "{{ docker_apps_singbox_memory | default('128m') }}"
    cpus: "0.5"
    memory_reservation: "{{ docker_apps_singbox_memory_reservation | default('64m') }}"
    healthcheck:
      test: ["CMD-SHELL", "sing-box check -C /etc/sing-box/ || exit 1"]
      interval: 1800s
      timeout: 10s
      retries: 3
      start_period: 30s
  tags: [deploy, services, docker_apps, singbox, phase5]
