---
# ==============================================================================
# Sing-box Native Post-Render Service Management (Alpine / OpenRC)
# ==============================================================================

- name: Sing-box Native - Ensure system config directory exists
  become: true
  ansible.builtin.file:
    path: /etc/sing-box
    state: directory
    mode: "0755"
  tags: [deploy, services, docker_apps, singbox, phase5]

- name: Sing-box Native - Ensure certs directory exists
  become: true
  ansible.builtin.file:
    path: /etc/sing-box/certs
    state: directory
    mode: "0755"
  tags: [deploy, services, docker_apps, singbox, phase5]

- name: Sing-box Native - Generate self-signed cert for Hysteria2 if needed
  become: true
  ansible.builtin.shell: |
    set -eu
    keypair_dir=$(mktemp -d)
    trap 'rm -rf "$keypair_dir"' EXIT
    sing-box generate tls-keypair bing.com --months 120 > "$keypair_dir/keypair.pem"
    awk '/BEGIN PRIVATE KEY/{in_key=1} in_key {print} /END PRIVATE KEY/{in_key=0}' \
      "$keypair_dir/keypair.pem" > /etc/sing-box/certs/key.pem
    awk '/BEGIN CERTIFICATE/{in_cert=1} in_cert {print} /END CERTIFICATE/{in_cert=0}' \
      "$keypair_dir/keypair.pem" > /etc/sing-box/certs/cert.pem
    test -s /etc/sing-box/certs/key.pem
    test -s /etc/sing-box/certs/cert.pem
    chmod 0600 /etc/sing-box/certs/key.pem
    chmod 0644 /etc/sing-box/certs/cert.pem
  args:
    creates: /etc/sing-box/certs/cert.pem
  no_log: true
  tags: [deploy, services, docker_apps, singbox, phase5]
- name: Sing-box Native - Configure OpenRC environment defaults
  become: true
  ansible.builtin.copy:
    dest: /etc/conf.d/sing-box
    content: |
      # Managed by AuroraOps
      SINGBOX_CONFIG=/etc/sing-box
      SINGBOX_WORKDIR=/var/lib/sing-box
      export ENABLE_DEPRECATED_SPECIAL_OUTBOUNDS=true
      export ENABLE_DEPRECATED_DNS_SERVERS=true
    mode: "0644"
  tags: [deploy, services, docker_apps, singbox, phase5]
- name: Sing-box Native - Sync modular config to system directory
  become: true
  ansible.builtin.copy:
    src: /opt/dockers/singbox/config/
    dest: /etc/sing-box/
    remote_src: true
    mode: "0644"
  when: not ansible_check_mode
  tags: [deploy, services, docker_apps, singbox, phase5]

- name: Sing-box Native - Detect interrupted OpenRC start
  become: true
  ansible.builtin.stat:
    path: /run/openrc/starting/sing-box
  register: docker_apps_singbox_openrc_starting
  changed_when: false
  tags: [deploy, services, docker_apps, singbox, phase5]

- name: Sing-box Native - Check process after interrupted OpenRC start
  become: true
  ansible.builtin.command: pgrep -x sing-box
  register: docker_apps_singbox_process_probe
  changed_when: false
  failed_when: false
  when: docker_apps_singbox_openrc_starting.stat.exists
  tags: [deploy, services, docker_apps, singbox, phase5]

- name: Sing-box Native - Clear stale OpenRC start state
  become: true
  ansible.builtin.service:
    name: sing-box
    state: stopped
  when:
    - docker_apps_singbox_openrc_starting.stat.exists
    - docker_apps_singbox_process_probe.rc | default(1) != 0
  tags: [deploy, services, docker_apps, singbox, phase5]

- name: Sing-box Native - Ensure OpenRC Service Enabled and Started
  become: true
  ansible.builtin.service:
    name: sing-box
    enabled: true
    state: started
  tags: [deploy, services, docker_apps, singbox, phase5]
