---
# CLIProxyAPI - 使用 container_deployer Meta 角色部署

- name: Check if PostgreSQL is installed for CLIProxyAPI
  ansible.builtin.stat:
    path: /etc/postgresql
  register: docker_apps_cliproxyapi_postgresql_installed
  when: docker_apps_cliproxyapi_use_postgres | bool
  tags: [deploy, services, docker_apps, cliproxyapi, init_db, phase5]

- name: Check if Postgres user exists
  become: true
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - "SELECT 1 FROM pg_roles WHERE rolname='{{ docker_apps_cliproxyapi_pg_user }}'"
  register: docker_apps_cliproxy_user_exists
  changed_when: false
  failed_when: docker_apps_cliproxy_user_exists.rc != 0
  when:
    - docker_apps_cliproxyapi_use_postgres | bool
    - docker_apps_cliproxyapi_postgresql_installed.stat.exists | default(false)
  tags: [deploy, services, docker_apps, cliproxyapi, init_db, phase5]

- name: Create Postgres user
  become: true
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - >-
        CREATE USER {{ docker_apps_cliproxyapi_pg_user }}
        WITH PASSWORD '{{ docker_apps_cliproxyapi_pg_pass }}';
  changed_when: true
  when:
    - docker_apps_cliproxyapi_use_postgres | bool
    - docker_apps_cliproxyapi_postgresql_installed.stat.exists | default(false)
    - docker_apps_cliproxy_user_exists.stdout | default('') | trim != '1'
  no_log: true
  tags: [deploy, services, docker_apps, cliproxyapi, init_db, phase5]

- name: Check if Postgres database exists
  become: true
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - "SELECT 1 FROM pg_database WHERE datname='{{ docker_apps_cliproxyapi_pg_db }}'"
  register: docker_apps_cliproxy_db_exists
  changed_when: false
  failed_when: docker_apps_cliproxy_db_exists.rc != 0
  when:
    - docker_apps_cliproxyapi_use_postgres | bool
    - docker_apps_cliproxyapi_postgresql_installed.stat.exists | default(false)
  tags: [deploy, services, docker_apps, cliproxyapi, init_db, phase5]

- name: Create Postgres database
  become: true
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - >-
        CREATE DATABASE {{ docker_apps_cliproxyapi_pg_db }}
        OWNER {{ docker_apps_cliproxyapi_pg_user }};
  changed_when: true
  when:
    - docker_apps_cliproxyapi_use_postgres | bool
    - docker_apps_cliproxyapi_postgresql_installed.stat.exists | default(false)
    - docker_apps_cliproxy_db_exists.stdout | default('') | trim != '1'
  tags: [deploy, services, docker_apps, cliproxyapi, init_db, phase5]

- name: Ensure cliproxyapi directory exists
  become: true
  ansible.builtin.file:
    path: /opt/dockers/cliproxyapi
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Load CLIProxyAPI Antigravity model catalog
  ansible.builtin.include_vars:
    file: "{{ role_path }}/files/cliproxyapi_antigravity_models.json"
    name: docker_apps_cliproxyapi_antigravity_catalog
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Validate CLIProxyAPI Antigravity model catalog
  ansible.builtin.assert:
    that:
      - docker_apps_cliproxyapi_antigravity_catalog.models is sequence
      - docker_apps_cliproxyapi_antigravity_catalog.models | length > 0
      - >-
        (
          docker_apps_cliproxyapi_antigravity_catalog.models
          | selectattr('upstream_name', 'equalto', 'gemini-pro-agent')
          | list
          | length
        ) == 1
    fail_msg: >-
      官方 Antigravity 模型目录缺失或不包含 gemini-pro-agent，
      请先运行 make refresh-cliproxyapi-models
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Check whether cliproxyapi config already exists
  become: true
  ansible.builtin.stat:
    path: /opt/dockers/cliproxyapi/config.yaml
  register: docker_apps_cliproxyapi_config
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Load private CLIProxyAPI AI Provider seed when present
  ansible.builtin.include_vars:
    file: "{{ docker_apps_cliproxyapi_ai_providers_file }}"
  no_log: true
  when:
    - >-
      docker_apps_cliproxyapi_ai_providers_file | default('', true) | length > 0
      and query(
        'ansible.builtin.fileglob',
        docker_apps_cliproxyapi_ai_providers_file | default('', true)
      ) | length > 0
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Load full CLIProxyAPI runtime config seed when present
  ansible.builtin.include_vars:
    file: "{{ docker_apps_cliproxyapi_config_seed_file }}"
    name: docker_apps_cliproxyapi_config_seed_vars
  no_log: true
  when:
    - >-
      docker_apps_cliproxyapi_config_seed_file | default('', true) | length > 0
      and query(
        'ansible.builtin.fileglob',
        docker_apps_cliproxyapi_config_seed_file | default('', true)
      ) | length > 0
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Validate CLIProxyAPI API keys
  ansible.builtin.assert:
    that:
      - docker_apps_cliproxyapi_api_keys is sequence
      - docker_apps_cliproxyapi_api_keys is not string
      - docker_apps_cliproxyapi_api_keys | length == 6
      - >-
        (
          docker_apps_cliproxyapi_api_keys
          | select('string')
          | map('trim')
          | reject('equalto', '')
          | list
          | length
        ) == docker_apps_cliproxyapi_api_keys | length
    fail_msg: >-
      CLIProxyAPI API keys must be a non-empty Vault-supplied list of strings.
  no_log: true
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Validate cliproxyapi management key
  ansible.builtin.assert:
    that:
      - cliproxyapi_management_key is defined
      - cliproxyapi_management_key | string | trim | length > 0
    fail_msg: "CLIProxyAPI 管理密钥不能为空，请在 secrets/vault.yml 中设置 cliproxyapi_management_key"
  no_log: true
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Enforce CLIProxyAPI config permissions
  become: true
  no_log: true
  ansible.builtin.file:
    path: /opt/dockers/cliproxyapi/config.yaml
    state: file
    owner: root
    group: root
    mode: '0600'
  when: docker_apps_cliproxyapi_config.stat.exists
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Read CLIProxyAPI config before alias migration
  become: true
  no_log: true
  ansible.builtin.slurp:
    src: /opt/dockers/cliproxyapi/config.yaml
  register: docker_apps_cliproxyapi_config_contents
  when: docker_apps_cliproxyapi_config.stat.exists
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Remove managed CLIProxyAPI Antigravity alias block before reconciliation
  become: true
  no_log: true
  diff: false
  ansible.builtin.replace:
    path: /opt/dockers/cliproxyapi/config.yaml
    regexp: '(?ms)^# BEGIN AuroraOps CLIProxyAPI Antigravity aliases$\n.*?^# END AuroraOps CLIProxyAPI Antigravity aliases\n?'
    replace: ''
  when:
    - docker_apps_cliproxyapi_config.stat.exists
    - >-
      (
        (
          docker_apps_cliproxyapi_config_contents.content
          | b64decode
          | regex_findall('(?m)^oauth-model-alias:')
          | length
        ) != 1
      ) or (
        '# BEGIN AuroraOps CLIProxyAPI Antigravity aliases' not in
        (docker_apps_cliproxyapi_config_contents.content | b64decode)
      )
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Remove unmanaged CLIProxyAPI Antigravity alias blocks
  become: true
  no_log: true
  diff: false
  ansible.builtin.replace:
    path: /opt/dockers/cliproxyapi/config.yaml
    regexp: '(?m)^oauth-model-alias:\n(?:^[ \t][^\n]*(?:\n|$))+'
    replace: ''
  when:
    - docker_apps_cliproxyapi_config.stat.exists
    - >-
      (
        (
          docker_apps_cliproxyapi_config_contents.content
          | b64decode
          | regex_findall('(?m)^oauth-model-alias:')
          | length
        ) != 1
      ) or (
        '# BEGIN AuroraOps CLIProxyAPI Antigravity aliases' not in
        (docker_apps_cliproxyapi_config_contents.content | b64decode)
      )
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Reconcile CLIProxyAPI Antigravity aliases
  become: true
  no_log: true
  diff: false
  ansible.builtin.blockinfile:
    path: /opt/dockers/cliproxyapi/config.yaml
    marker: "# {mark} AuroraOps CLIProxyAPI Antigravity aliases"
    insertafter: EOF
    block: >-
      {{ lookup('template', 'cliproxyapi_antigravity_config.yaml.j2') }}
  when: docker_apps_cliproxyapi_config.stat.exists
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Migrate CLIProxyAPI API keys in existing config
  become: true
  no_log: true
  diff: false
  ansible.builtin.replace:
    path: /opt/dockers/cliproxyapi/config.yaml
    regexp: '(?m)(?:^api-keys:\n(?:  - [^\n]*(?:\n|$))+|^api-keys:[ \t]*\[\][ \t]*$)'
    replace: >-
      {{ 'api-keys:\n'
         ~ lookup('template', 'cliproxyapi_api_keys.yaml.j2') }}
  when: docker_apps_cliproxyapi_config.stat.exists
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Add API keys to existing CLIProxyAPI config without key section
  become: true
  no_log: true
  diff: false
  ansible.builtin.blockinfile:
    path: /opt/dockers/cliproxyapi/config.yaml
    marker: "# {mark} AuroraOps CLIProxyAPI API keys"
    insertafter: EOF
    block: >-
      {{ 'api-keys:\n'
         ~ lookup('template', 'cliproxyapi_api_keys.yaml.j2') }}
  when:
    - docker_apps_cliproxyapi_config.stat.exists
    - >-
      (
        docker_apps_cliproxyapi_config_contents.content
        | b64decode
        | regex_search('(?m)^api-keys:')
      ) is none
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Seed full CLIProxyAPI runtime config when repository seed is available
  become: true
  no_log: true
  diff: false
  ansible.builtin.copy:
    content: >-
      {{
        docker_apps_cliproxyapi_config_seed_vars.cliproxyapi_config_seed
        | to_nice_yaml(indent=2, width=1000)
      }}
    dest: /opt/dockers/cliproxyapi/config.yaml
    owner: root
    mode: '0600'
    force: false
  when:
    - not docker_apps_cliproxyapi_config.stat.exists
    - docker_apps_cliproxyapi_config_seed_vars is defined
    - docker_apps_cliproxyapi_config_seed_vars.cliproxyapi_config_seed is defined
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Seed cliproxyapi config file (force=false, 避免覆盖管理面板写入的 AI Provider 配置)
  become: true
  no_log: true
  diff: false
  ansible.builtin.template:
    src: cliproxyapi_config.yaml.j2
    dest: /opt/dockers/cliproxyapi/config.yaml
    owner: root
    mode: '0600'
    force: false
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Deploy cliproxyapi container
  ansible.builtin.include_role:
    name: vps.services.container_deployer
  vars:
    cdp_name: "cliproxyapi"
    cdp_image: "{{ cliproxyapi_image }}"
    cdp_dirs: ["", "auths", "logs"]
    cdp_memory: "{{ docker_apps_cliproxyapi_memory | default('128m') }}"
    cdp_cpus: "0.5"
    cdp_memory_reservation: "{{ docker_apps_cliproxyapi_memory_reservation | default('32m') }}"
    cdp_oom_score_adj: "-300"
    cdp_networks: "{{ docker_apps_cliproxyapi_networks }}"
    cdp_ports:
      - "{{ docker_apps_cliproxyapi_bind_address }}:{{ docker_apps_app_port_cliproxyapi }}:8317"
    cdp_volumes:
      - "/opt/dockers/cliproxyapi/config.yaml:/CLIProxyAPI/config.yaml"
      - "/opt/dockers/cliproxyapi/auths:/root/.cli-proxy-api"
      - "/opt/dockers/cliproxyapi/logs:/CLIProxyAPI/logs"
    cdp_etc_hosts:
      "host.docker.internal": "host-gateway"
    cdp_env:
      TZ: "Asia/Shanghai"
      # Keep Go heap below Docker's 256 MiB cgroup limit while retaining headroom.
      GOMEMLIMIT: "220MiB"
      PGSTORE_DSN: >-
        {{
          (docker_apps_cliproxyapi_use_postgres | bool)
          | ternary(
              'postgresql://'
              ~ docker_apps_cliproxyapi_pg_user
              ~ ':'
              ~ (docker_apps_cliproxyapi_pg_pass | urlencode)
              ~ '@'
              ~ docker_apps_cliproxyapi_pg_host
              ~ ':'
              ~ (docker_apps_cliproxyapi_pg_port | string)
              ~ '/'
              ~ docker_apps_cliproxyapi_pg_db
              ~ '?sslmode=disable',
              omit
            )
        }}
      MANAGEMENT_PASSWORD: "{{ cliproxyapi_management_key }}"
      MANAGEMENT_STATIC_PATH: "/CLIProxyAPI/static/management.html"
    cdp_healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8317'"]
      interval: 1800s
      timeout: 10s
      retries: 3
      start_period: 10s
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Deploy cliproxyapi scheduled restart service
  become: true
  ansible.builtin.template:
    src: cliproxyapi-scheduler-restart.service.j2
    dest: /etc/systemd/system/cliproxyapi-scheduler-restart.service
    owner: root
    group: root
    mode: "0644"
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Deploy cliproxyapi scheduled restart timer
  become: true
  ansible.builtin.template:
    src: cliproxyapi-scheduler-restart.timer.j2
    dest: /etc/systemd/system/cliproxyapi-scheduler-restart.timer
    owner: root
    group: root
    mode: "0644"
  notify: restart cliproxyapi scheduler timer
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Enable and start cliproxyapi scheduled restart timer
  become: true
  ansible.builtin.systemd:
    name: cliproxyapi-scheduler-restart.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]
