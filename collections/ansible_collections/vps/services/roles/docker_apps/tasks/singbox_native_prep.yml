---
# ==============================================================================
# Sing-box Native Deployment (Alpine Linux / OpenRC / Low-Memory Minimal Mode)
# ==============================================================================

- name: Sing-box Native - Check package state
  become: true
  ansible.builtin.command:
    argv:
      - apk
      - info
      - -e
      - sing-box
      - sing-box-openrc
  register: docker_apps_singbox_native_package_probe
  changed_when: false
  failed_when: false
  tags: [deploy, services, docker_apps, singbox, phase5]

- name: Sing-box Native - Install packages
  become: true
  community.general.apk:
    name:
      - sing-box
      - sing-box-openrc
    state: present
    update_cache: "{{ docker_apps_singbox_native_package_probe.rc != 0 }}"
  tags: [deploy, services, docker_apps, singbox, phase5]

- name: Sing-box Native - Generate Reality Keypair
  become: true
  ansible.builtin.command:
    argv:
      - sing-box
      - generate
      - reality-keypair
  register: docker_apps_singbox_native_reality_key_gen
  changed_when: true
  no_log: true
  when:
    - not ansible_check_mode
    - not (docker_apps_reality_key_file.stat.exists | default(false))
  tags: [deploy, services, docker_apps, singbox, phase5]

- name: Sing-box Native - Resolve Reality Key Generator Output
  ansible.builtin.set_fact:
    docker_apps_reality_key_gen: "{{ docker_apps_singbox_native_reality_key_gen }}"
  when:
    - not ansible_check_mode
    - not (docker_apps_reality_key_file.stat.exists | default(false))
  tags: [deploy, services, docker_apps, singbox, phase5]
