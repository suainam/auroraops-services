---
- name: Ensure magpie host directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "65532"
    group: "65532"
    mode: "0750"
  loop:
    - "{{ docker_apps_magpie_data_dir }}"
    - "{{ docker_apps_magpie_data_dir }}/config"
  tags: [deploy, services, docker_apps, magpie, phase5]

- name: Clean up historical dangling baseline magpie containers
  become: true
  ansible.builtin.shell:
    cmd: "docker rm -f $(docker ps -a -q -f name='^magpie_baseline_') 2>/dev/null || true"
  changed_when: false
  when: not ansible_check_mode
  tags: [deploy, services, docker_apps, magpie, phase5]

- name: Probe existing magpie container for pre-deploy baseline
  become: true
  community.docker.docker_container_info:
    name: magpie
  register: _magpie_pre_deploy_info
  tags: [deploy, services, docker_apps, magpie, phase5]

- name: Determine upgrade checkpoint identifier for magpie
  ansible.builtin.set_fact:
    _magpie_checkpoint_id: "{{ upgrade_run_id | default(upgrade_checkpoint_id | default('upgrade_' ~ ((docker_apps_magpie_image | string) | regex_replace('[^a-zA-Z0-9_.-]', '_')))) }}"
  tags: [deploy, services, docker_apps, magpie, phase5]
- name: Check if magpie checkpoint already exists from earlier attempt
  become: true
  ansible.builtin.stat:
    path: "{{ docker_apps_magpie_data_dir }}/lifecycle/checkpoints/{{ _magpie_checkpoint_id }}/checkpoint.json"
  register: _magpie_existing_cp_stat
  tags: [deploy, services, docker_apps, magpie, phase5]

- name: Pre-pull the target magpie image before the container is stopped
  # container_deployer pulls the image inside the same task that creates and
  # starts the replacement, which runs after the old container is stopped. A
  # slow registry fetch there is pure downtime for every caller. Pulling the
  # target tag first, while the old container is still serving, keeps the
  # outage window to stop -> rename -> start.
  become: true
  community.docker.docker_image:
    name: "{{ docker_apps_magpie_image }}"
    source: pull
  when:
    - not ansible_check_mode
    - docker_apps_magpie_pull | default(false) | bool
  tags: [deploy, services, docker_apps, magpie, phase5]
- name: Solidify immutable versioned baseline for existing magpie
  become: true
  block:
    - name: Ensure magpie checkpoint directory exists
      ansible.builtin.file:
        path: "{{ docker_apps_magpie_data_dir }}/lifecycle/checkpoints/{{ _magpie_checkpoint_id }}"
        state: directory
        owner: "65532"
        group: "65532"
        mode: "0750"

    - name: Write versioned checkpoint record for magpie
      ansible.builtin.copy:
        dest: "{{ docker_apps_magpie_data_dir }}/lifecycle/checkpoints/{{ _magpie_checkpoint_id }}/checkpoint.json"
        content: >-
          {{
            {
              "service": "magpie",
              "checkpoint_id": _magpie_checkpoint_id,
              "mode": "existing_service",
              "baseline_container_name": "magpie_baseline_" ~ _magpie_checkpoint_id,
              "baseline_image": _magpie_pre_deploy_info.container.Config.Image,
              "baseline_image_id": _magpie_pre_deploy_info.container.Image,
              "timestamp": ansible_date_time.iso8601 | default('unknown')
            } | to_nice_json
          }}
        mode: "0400"
        owner: "65532"
        group: "65532"

    - name: Update latest checkpoint pointer for magpie
      ansible.builtin.copy:
        dest: "{{ docker_apps_magpie_data_dir }}/lifecycle/latest_checkpoint.txt"
        content: "{{ _magpie_checkpoint_id }}\n"
        mode: "0640"
        owner: "65532"
        group: "65532"
  when:
    - not ansible_check_mode
    - _magpie_pre_deploy_info.exists | default(false)
    - not (_magpie_existing_cp_stat.stat.exists | default(false))
  tags: [deploy, services, docker_apps, magpie, phase5]

- name: Quiesce live magpie container before it is renamed to the baseline
  community.docker.docker_container:
    name: "{{ docker_apps_container_name | default('magpie') }}"
    docker_host: "{{ docker_host | default(omit) }}"
    state: stopped
  when:
    - not ansible_check_mode
    - _magpie_pre_deploy_info.exists | default(false)
    - _magpie_pre_deploy_info.container.State.Running | default(false)
  tags: [deploy, services, docker_apps, magpie, phase5]
- name: Write clean slate baseline for first install of magpie
  become: true
  block:
    - name: Ensure magpie checkpoint directory exists
      ansible.builtin.file:
        path: "{{ docker_apps_magpie_data_dir }}/lifecycle/checkpoints/{{ _magpie_checkpoint_id }}"
        state: directory
        owner: "65532"
        group: "65532"
        mode: "0750"

    - name: Write first install checkpoint record for magpie
      ansible.builtin.copy:
        dest: "{{ docker_apps_magpie_data_dir }}/lifecycle/checkpoints/{{ _magpie_checkpoint_id }}/checkpoint.json"
        content: >-
          {{
            {
              "service": "magpie",
              "checkpoint_id": _magpie_checkpoint_id,
              "mode": "first_install",
              "timestamp": ansible_date_time.iso8601 | default('unknown')
            } | to_nice_json
          }}
        mode: "0400"
        owner: "65532"
        group: "65532"

    - name: Update latest checkpoint pointer for magpie
      ansible.builtin.copy:
        dest: "{{ docker_apps_magpie_data_dir }}/lifecycle/latest_checkpoint.txt"
        content: "{{ _magpie_checkpoint_id }}\n"
        mode: "0640"
        owner: "65532"
        group: "65532"
  when:
    - not ansible_check_mode
    - not (_magpie_pre_deploy_info.exists | default(false))
    - not (_magpie_existing_cp_stat.stat.exists | default(false))
  tags: [deploy, services, docker_apps, magpie, phase5]

- name: Probe if baseline magpie container already preserved
  become: true
  community.docker.docker_container_info:
    name: "{{ (docker_apps_container_name | default('magpie')) ~ '_baseline_' ~ _magpie_checkpoint_id }}"
    docker_host: "{{ docker_host | default(omit) }}"
  register: _magpie_pre_deploy_baseline_info
  # Probed unconditionally: after an interrupted run the live container may
  # already be renamed to the baseline name, so gating this on the live
  # container's existence leaves the baseline invisible and unstopped.
  when:
    - not ansible_check_mode
  tags: [deploy, services, docker_apps, magpie, phase5]

- name: Quiesce live magpie container before it is renamed to the baseline
  # The snapshot block above stops the container only when no checkpoint exists
  # yet. A retry finds the checkpoint already written, skips that block, and
  # would rename a still-running container: its docker-proxy keeps 30022/30023
  # bound, so the new container creates fine and then fails to start with
  # "Bind for 127.0.0.1:30022 failed: port is already allocated".
  community.docker.docker_container:
    name: "{{ docker_apps_container_name | default('magpie') }}"
    docker_host: "{{ docker_host | default(omit) }}"
    state: stopped
  when:
    - not ansible_check_mode
    - _magpie_pre_deploy_info.exists | default(false)
    - _magpie_pre_deploy_info.container.State.Running | default(false)
  tags: [deploy, services, docker_apps, magpie, phase5]

- name: Quiesce the preserved baseline magpie container so it releases the ports
  # Same invariant from the other side: the baseline is kept for rollback and is
  # restarted only by the rescue path, so it must not hold the published ports
  # while the replacement starts.
  community.docker.docker_container:
    name: "{{ (docker_apps_container_name | default('magpie')) ~ '_baseline_' ~ _magpie_checkpoint_id }}"
    docker_host: "{{ docker_host | default(omit) }}"
    state: stopped
  when:
    - not ansible_check_mode
    - _magpie_pre_deploy_baseline_info.exists | default(false)
    - _magpie_pre_deploy_baseline_info.container.State.Running | default(false)
  tags: [deploy, services, docker_apps, magpie, phase5]

- name: Rename baseline magpie container to preserve runtime contract before deploy
  ansible.builtin.command:
    argv:
      - docker
      - rename
      - "{{ docker_apps_container_name | default('magpie') }}"
      - "{{ (docker_apps_container_name | default('magpie')) ~ '_baseline_' ~ _magpie_checkpoint_id }}"
  when:
    - not ansible_check_mode
    - _magpie_pre_deploy_info.exists | default(false)
    - not (_magpie_pre_deploy_baseline_info.exists | default(false))
  tags: [deploy, services, docker_apps, magpie, phase5]

- name: Deploy magpie container with failure recovery
  block:
    - name: Deploy magpie container via container_deployer
      ansible.builtin.include_role:
        name: vps.services.container_deployer
        apply:
          tags:
            - magpie
            - phase5
      vars:
        cdp_name: "magpie"
        cdp_image: "{{ docker_apps_magpie_image }}"
        cdp_pull: "{{ docker_apps_magpie_pull | default(false) | bool }}"
        container_deployer_cdp_pull: "{{ docker_apps_magpie_pull | default(false) | bool }}"
        cdp_dirs: ["config"]
        cdp_dir_owner: "65532"
        cdp_dir_group: "65532"
        cdp_dir_mode: "0750"
        cdp_memory: "{{ docker_apps_magpie_memory }}"
        cdp_memory_reservation: "{{ docker_apps_magpie_memory_reservation }}"
        cdp_cpus: "{{ docker_apps_magpie_cpus }}"
        cdp_restart_policy: "unless-stopped"
        cdp_networks: [{name: "sweb"}]
        cdp_ports:
          - "127.0.0.1:{{ docker_apps_app_port_magpie_api }}:3425"
          - "127.0.0.1:{{ docker_apps_app_port_magpie_web }}:3430"
        cdp_volumes:
          - "{{ docker_apps_magpie_data_dir }}/config:/config"
        cdp_command:
          - "web"
          - "--addr"
          - "0.0.0.0:3430"
          - "--no-open"
        cdp_env:
          TZ: "Asia/Shanghai"
          MAGPIE_ADDR: "0.0.0.0:3425"
          MAGPIE_WEB_ADDR: "0.0.0.0:3430"
          MAGPIE_WEB_KEY: "{{ docker_apps_magpie_web_key | default(omit) }}"
          GOMEMLIMIT: "{{ docker_apps_magpie_gomemlimit }}"
        cdp_healthcheck:
          test: ["CMD", "/magpie", "healthcheck"]
          interval: 1800s
          timeout: 10s
          retries: 3
          start_period: 15s

    - name: Automatically remove baseline magpie container after successful deployment
      become: true
      community.docker.docker_container:
        name: "{{ (docker_apps_container_name | default('magpie')) ~ '_baseline_' ~ _magpie_checkpoint_id }}"
        state: absent
        docker_host: "{{ docker_host | default(omit) }}"
      when: not ansible_check_mode
  rescue:
    - name: Remove partially deployed magpie container after deploy failure
      community.docker.docker_container:
        name: "{{ docker_apps_container_name | default('magpie') }}"
        state: absent
        docker_host: "{{ docker_host | default(omit) }}"
    - name: Check if preserved baseline container exists before restore
      community.docker.docker_container_info:
        name: "{{ (docker_apps_container_name | default('magpie')) ~ '_baseline_' ~ _magpie_checkpoint_id }}"
        docker_host: "{{ docker_host | default(omit) }}"
      register: _magpie_deploy_rescue_baseline_info
    - name: Restore baseline magpie container after deploy failure
      ansible.builtin.command:
        argv:
          - docker
          - rename
          - "{{ (docker_apps_container_name | default('magpie')) ~ '_baseline_' ~ _magpie_checkpoint_id }}"
          - "{{ docker_apps_container_name | default('magpie') }}"
      when: _magpie_deploy_rescue_baseline_info.exists | default(false)
    - name: Restart restored baseline magpie container
      community.docker.docker_container:
        name: "{{ docker_apps_container_name | default('magpie') }}"
        state: started
        docker_host: "{{ docker_host | default(omit) }}"
      when:
        - _magpie_deploy_rescue_baseline_info.exists | default(false)
        - _magpie_pre_deploy_info.container.State.Running | default(false)
    - name: Fail closed after restoring baseline container
      ansible.builtin.fail:
        msg: "Deploy failed: magpie container deployment failed; baseline container safely restored."
  tags: [deploy, services, docker_apps, magpie, phase5]
