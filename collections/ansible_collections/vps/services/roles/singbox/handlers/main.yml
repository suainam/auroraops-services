---
# Mode-aware restart. Configuration tasks notify this handler rather than the
# OpenRC one directly: notifying only the OpenRC handler meant a docker-mode
# host wrote new configuration but never restarted, so it kept serving the
# previous configuration indefinitely and every check still passed.
- name: Restart singbox service
  become: true
  ansible.builtin.include_tasks: restart.yml
  tags: [deploy, verify, rollback, services, singbox, phase5]

- name: Restart singbox docker container
  become: true
  community.docker.docker_container:
    name: singbox
    state: started
    restart: true
  when:
    - not ansible_check_mode
    - (singbox_effective_mode | default('docker')) == 'docker'

- name: Restart singbox openrc service
  become: true
  ansible.builtin.service:
    name: sing-box
    state: restarted
  when:
    - not ansible_check_mode
    - (singbox_effective_mode | default('native')) == 'native'

- name: Reload singbox openrc service
  become: true
  ansible.builtin.service:
    name: sing-box
    state: reloaded
  when:
    - not ansible_check_mode
    - (singbox_effective_mode | default('native')) == 'native'
