---
- name: Resolve singbox deployment mode for verification
  ansible.builtin.import_tasks: resolve.yml
  tags: [verify, services, singbox, phase5]

- name: Verify native singbox branch
  ansible.builtin.import_tasks: verify_native.yml
  when: singbox_effective_mode == 'native'
  tags: [verify, services, singbox, phase5]

- name: Verify docker singbox branch
  ansible.builtin.import_tasks: verify_docker.yml
  when: singbox_effective_mode == 'docker'
  tags: [verify, services, singbox, phase5]
