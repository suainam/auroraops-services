---
- name: Sing-box - Ensure data directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop:
    - "{{ singbox_data_dir }}"
    - "{{ singbox_data_dir }}/web"
    - "{{ singbox_config_dir }}"
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Check for existing Short IDs
  ansible.builtin.stat:
    path: "{{ singbox_data_dir }}/short_ids.txt"
  register: singbox_short_ids_stat
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Generate Short IDs if missing
  become: false
  delegate_to: localhost
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - "import secrets; print('\\n'.join(secrets.token_hex(8) for _ in range({{ singbox_reality_short_id_count | default(8) | int }})))"
  register: singbox_short_ids_gen
  check_mode: false
  changed_when: false
  no_log: true
  when: not singbox_short_ids_stat.stat.exists
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Save generated Short IDs
  become: true
  ansible.builtin.copy:
    dest: "{{ singbox_data_dir }}/short_ids.txt"
    content: "{{ singbox_short_ids_gen.stdout }}\n"
    mode: "0600"
  when:
    - not singbox_short_ids_stat.stat.exists
    - not ansible_check_mode
  no_log: true
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Read Short IDs
  become: true
  ansible.builtin.slurp:
    src: "{{ singbox_data_dir }}/short_ids.txt"
  register: singbox_short_ids_raw
  no_log: true
  when: singbox_short_ids_stat.stat.exists
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Parse Short IDs list
  ansible.builtin.set_fact:
    singbox_reality_short_ids: "{{ (singbox_short_ids_raw.content | b64decode).strip().splitlines() if singbox_short_ids_stat.stat.exists else singbox_short_ids_gen.stdout.splitlines() }}"
  no_log: true
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Check for existing Reality Key
  become: true
  ansible.builtin.stat:
    path: "{{ singbox_data_dir }}/reality_key.txt"
  register: singbox_reality_key_stat
  tags: [deploy, services, singbox, phase5]

- name: Sing-box Docker - Generate Reality Keypair
  become: true
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - "{{ singbox_image }}"
      - generate
      - reality-keypair
  register: singbox_docker_reality_key_gen
  when:
    - not singbox_reality_key_stat.stat.exists
    - singbox_effective_mode == 'docker'
    - not ansible_check_mode
  no_log: true
  tags: [deploy, services, singbox, phase5]

- name: Sing-box Native - Generate Reality Keypair on controller
  become: false
  delegate_to: localhost
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - |
        import base64
        from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey
        key = X25519PrivateKey.generate()
        encode = lambda data: base64.urlsafe_b64encode(data).decode().rstrip("=")
        print("PrivateKey:", encode(key.private_bytes_raw()))
        print("PublicKey:", encode(key.public_key().public_bytes_raw()))
  register: singbox_native_reality_key_gen
  check_mode: false
  changed_when: false
  when:
    - not singbox_reality_key_stat.stat.exists
    - singbox_effective_mode == 'native'
  no_log: true
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Save generated Reality Key
  become: true
  ansible.builtin.copy:
    dest: "{{ singbox_data_dir }}/reality_key.txt"
    content: >-
      {{
        (singbox_docker_reality_key_gen.stdout | default(''))
        if singbox_effective_mode == 'docker'
        else (singbox_native_reality_key_gen.stdout | default(''))
      }}
    mode: "0600"
  when:
    - not singbox_reality_key_stat.stat.exists
    - not ansible_check_mode
  no_log: true
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Read Reality Key
  become: true
  ansible.builtin.slurp:
    src: "{{ singbox_data_dir }}/reality_key.txt"
  register: singbox_reality_key_raw
  when:
    - singbox_reality_key_stat.stat.exists or not ansible_check_mode
  no_log: true
  tags: [deploy, services, singbox, phase5]

- name: Sing-box Native - Use ephemeral real keys for pristine check
  ansible.builtin.set_fact:
    singbox_reality_key_raw:
      content: "{{ singbox_native_reality_key_gen.stdout | b64encode }}"
  when:
    - ansible_check_mode
    - not singbox_reality_key_stat.stat.exists
    - singbox_effective_mode == 'native'
  no_log: true
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Parse Reality Keys
  ansible.builtin.set_fact:
    singbox_reality_private_key: >-
      {{
        (singbox_reality_key_raw.content | b64decode | regex_search('PrivateKey:\s*([^\s]+)', '\1')) | first
        if singbox_reality_key_raw.content is defined
        else 'SIMULATED_PRIVATE_KEY'
      }}
    singbox_reality_public_key_generated: >-
      {{
        (singbox_reality_key_raw.content | b64decode | regex_search('PublicKey:\s*([^\s]+)', '\1')) | first
        if singbox_reality_key_raw.content is defined
        else 'SIMULATED_PUBLIC_KEY'
      }}
  no_log: true
  tags: [deploy, services, singbox, phase5]

# --- WireGuard private key: generated on the host, never in the repository -----
# The repository holds public keys only. Generating here rather than defaulting
# a value keeps one key from being shared by every peer that reads the file, and
# keeps the private half off the controller entirely.
- name: Sing-box - Check for existing host-local WireGuard private key
  become: true
  ansible.builtin.stat:
    path: "{{ singbox_wireguard_private_key_file }}"
  register: singbox_wireguard_private_key_stat
  when:
    - singbox_wireguard_enabled | default(false) | bool
    - (singbox_wireguard_private_key | default('')) | length == 0
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Generate host-local WireGuard private key
  become: true
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import os, base64, sys;
        fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600);
        os.write(fd, base64.b64encode(os.urandom(32)));
        os.close(fd)
      - "{{ singbox_wireguard_private_key_file }}"
  when:
    - singbox_wireguard_enabled | default(false) | bool
    - (singbox_wireguard_private_key | default('')) | length == 0
    - not singbox_wireguard_private_key_stat.stat.exists | default(false)
    - not ansible_check_mode
  changed_when: true
  no_log: true
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Load host-local WireGuard private key
  become: true
  ansible.builtin.slurp:
    src: "{{ singbox_wireguard_private_key_file }}"
  register: singbox_wireguard_private_key_raw
  when:
    - singbox_wireguard_enabled | default(false) | bool
    - (singbox_wireguard_private_key | default('')) | length == 0
    - not ansible_check_mode
  no_log: true
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Render with the host-local WireGuard private key
  ansible.builtin.set_fact:
    singbox_wireguard_private_key: >-
      {{
        singbox_wireguard_private_key_raw.content | b64decode | trim
        if singbox_wireguard_private_key_raw.content is defined
        else 'SIMULATED_WIREGUARD_PRIVATE_KEY'
      }}
  when:
    - singbox_wireguard_enabled | default(false) | bool
    - (singbox_wireguard_private_key | default('')) | length == 0
  no_log: true
  tags: [deploy, services, singbox, phase5]
