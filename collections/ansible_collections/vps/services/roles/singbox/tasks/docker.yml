---
- name: Sing-box Docker - Deploy container via community.docker
  become: true
  community.docker.docker_container:
    name: singbox
    image: "{{ singbox_image }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    volumes:
      - "{{ singbox_config_dir }}:/etc/sing-box:ro"
      - "{{ singbox_data_dir }}/web:/opt/dockers/singbox/web:ro"
      - "/etc/letsencrypt:/etc/letsencrypt:ro"
  when: not ansible_check_mode
  tags: [deploy, services, singbox, phase5]
