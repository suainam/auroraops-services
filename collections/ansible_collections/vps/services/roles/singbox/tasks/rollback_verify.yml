---
- name: Resolve singbox effective deployment mode for rollback verification
  ansible.builtin.import_tasks: resolve.yml
  tags: [rollback_verify, services, singbox, phase5]

- name: Verify singbox container stopped
  become: true
  community.docker.docker_container_info:
    name: singbox
  register: singbox_rollback_docker_info
  failed_when: singbox_rollback_docker_info.exists and singbox_rollback_docker_info.container.State.Running
  when: singbox_effective_mode == 'docker'
  tags: [rollback_verify, services, singbox, phase5]

- name: Probe singbox native OpenRC unit without changing state
  become: true
  ansible.builtin.stat:
    path: /etc/init.d/sing-box
  register: singbox_rollback_unit
  tags: [rollback_verify, services, singbox, phase5]

- name: Assert singbox native unit exists after a native deploy
  ansible.builtin.assert:
    that:
      - singbox_rollback_unit.stat.exists
    fail_msg: >-
      native mode is in effect but /etc/init.d/sing-box is absent, so the
      rollback cannot be verified. A missing unit is not the same as a stopped
      service.
  when: singbox_effective_mode == 'native'
  tags: [rollback_verify, services, singbox, phase5]

- name: Verify singbox native service stopped
  become: true
  ansible.builtin.command: rc-service sing-box status
  register: singbox_rollback_rc_status
  changed_when: false
  failed_when: singbox_rollback_rc_status.rc == 0 and 'started' in singbox_rollback_rc_status.stdout
  when: singbox_effective_mode == 'native'
  tags: [rollback_verify, services, singbox, phase5]
