---
- name: Sing-box - Deploy 01_base
  become: true
  diff: false
  ansible.builtin.template:
    src: base.json.j2
    dest: "{{ singbox_config_dir }}/01_base.json"
    mode: "0644"
  notify: Restart singbox openrc service
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Deploy 02_outbounds (Direct)
  become: true
  diff: false
  ansible.builtin.template:
    src: outbounds_direct.json.j2
    dest: "{{ singbox_config_dir }}/02_outbounds.json"
    mode: "0644"
  when: singbox_role | default('direct') == 'direct'
  notify: Restart singbox openrc service
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Deploy 02_outbounds (Relay)
  become: true
  diff: false
  ansible.builtin.template:
    src: outbounds_relay.json.j2
    dest: "{{ singbox_config_dir }}/02_outbounds.json"
    mode: "0644"
  when: singbox_role | default('direct') != 'direct'
  notify: Restart singbox openrc service
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Deploy 03_dns
  become: true
  diff: false
  ansible.builtin.template:
    src: dns.json.j2
    dest: "{{ singbox_config_dir }}/03_dns.json"
    mode: "0644"
  notify: Restart singbox openrc service
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Deploy 04_inbounds (Direct)
  become: true
  diff: false
  ansible.builtin.template:
    src: inbounds_direct.json.j2
    dest: "{{ singbox_config_dir }}/04_inbounds.json"
    mode: "0644"
  when: singbox_role | default('direct') == 'direct'
  notify: Restart singbox openrc service
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Deploy 04_inbounds (Relay)
  become: true
  diff: false
  ansible.builtin.template:
    src: inbounds_relay.json.j2
    dest: "{{ singbox_config_dir }}/04_inbounds.json"
    mode: "0644"
  when: singbox_role | default('direct') != 'direct'
  notify: Restart singbox openrc service
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Deploy 05_route (Direct)
  become: true
  diff: false
  ansible.builtin.template:
    src: route_direct.json.j2
    dest: "{{ singbox_config_dir }}/05_route.json"
    mode: "0644"
  when: singbox_role | default('direct') == 'direct'
  notify: Restart singbox openrc service
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Deploy 05_route (Relay)
  become: true
  diff: false
  ansible.builtin.template:
    src: route_relay.json.j2
    dest: "{{ singbox_config_dir }}/05_route.json"
    mode: "0644"
  when: singbox_role | default('direct') != 'direct'
  notify: Restart singbox openrc service
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Validate WireGuard parameters
  ansible.builtin.assert:
    that:
      - (singbox_wireguard_address | default('')) | length > 0
      - (singbox_wireguard_server | default('')) | length > 0
      - (singbox_wireguard_peer_public_key | default('')) | length > 0
      - (singbox_wireguard_private_key | default('')) | length > 0
      - (singbox_wireguard_system | default(false) | bool) or ((singbox_wireguard_loopback_inbound | default(true) | bool) and (singbox_wireguard_probe_url | default('') | length > 0))
    fail_msg: >-
      WireGuard endpoint requires singbox_wireguard_address, singbox_wireguard_server,
      singbox_wireguard_peer_public_key, and singbox_wireguard_private_key to be configured.
      Userspace mode (system: false) also requires singbox_wireguard_probe_url for reachability verification.
  when: singbox_wireguard_enabled | default(false) | bool
  tags: [deploy, services, singbox, wireguard, phase5]

- name: Sing-box - Deploy 06_wireguard
  become: true
  diff: false
  no_log: true
  ansible.builtin.template:
    src: 06_wireguard.json.j2
    dest: "{{ singbox_config_dir }}/06_wireguard.json"
    mode: "0600"
    owner: root
    group: root
  when: singbox_wireguard_enabled | default(false) | bool
  notify: Restart singbox openrc service
  tags: [deploy, services, singbox, wireguard, phase5]

- name: Sing-box - Remove 06_wireguard when disabled
  become: true
  ansible.builtin.file:
    path: "{{ singbox_config_dir }}/06_wireguard.json"
    state: absent
  when: not (singbox_wireguard_enabled | default(false) | bool)
  notify: Restart singbox openrc service
  tags: [deploy, services, singbox, wireguard, phase5]

- name: Sing-box - Generate Client Profile (YAML)
  become: true
  diff: false
  ansible.builtin.template:
    src: singbox_client_profile.yaml.j2
    dest: "{{ singbox_data_dir }}/web/{{ singbox_sub_token }}.yaml"
    mode: "0644"
  when:
    - singbox_role | default('direct') == 'direct'
    - (singbox_sub_token | default('')) | length > 0
  no_log: true
  tags: [deploy, services, singbox, phase5]

- name: Sing-box - Generate Client Compact Profile (YAML)
  become: true
  diff: false
  ansible.builtin.template:
    src: singbox_provider_profile.yaml.j2
    dest: "{{ singbox_data_dir }}/web/{{ singbox_sub_token }}.compact.yaml"
    mode: "0644"
  when:
    - singbox_role | default('direct') == 'direct'
    - (singbox_sub_token | default('')) | length > 0
  no_log: true
  tags: [deploy, services, singbox, phase5]
