---
- name: Verify Sing-box native configuration contract
  ansible.builtin.include_tasks: verify_config_contract.yml
  vars:
    singbox_verify_config_dir: "{{ singbox_native_config_dir }}"
  tags: [verify, services, singbox, phase5]

- name: Verify Sing-box native service is active and enabled on OpenRC
  become: true
  ansible.builtin.command: rc-service sing-box status
  register: singbox_native_rc_status
  changed_when: false
  failed_when: singbox_native_rc_status.rc != 0 or 'started' not in singbox_native_rc_status.stdout
  tags: [verify, services, singbox, phase5]

- name: Verify Sing-box native configuration parses
  become: true
  ansible.builtin.command: sing-box check -C "{{ singbox_native_config_dir }}"
  environment:
    GOMEMLIMIT: "15MiB"
  register: singbox_native_check
  changed_when: false
  failed_when: singbox_native_check.rc != 0
  tags: [verify, services, singbox, phase5]

- name: Verify the Sing-box binary itself runs
  become: true
  ansible.builtin.command: "{{ singbox_native_binary_path | default('/usr/bin/sing-box') }} version"
  register: singbox_native_binary_check
  changed_when: false
  failed_when: singbox_native_binary_check.rc != 0
  # Asserting the service alone is not enough: a half-installed host has
  # /etc/init.d/sing-box but no binary, and rc-service still answers.
  tags: [verify, services, singbox, phase5]

- name: Verify Sing-box native reality port is listening
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ singbox_reality_port }}"
    state: started
    timeout: 5
  tags: [verify, services, singbox, phase5]

# ---------------------------------------------------------------------------
# Pilot verification seam (#179)
# ---------------------------------------------------------------------------
# Everything below is opt-in and asserts externally observable state rather than
# file contents. The rule the spec sets is "assert what the host does, not what
# the template wrote" -- a config that renders correctly and a host that runs it
# are different claims, and only the second one is worth a verify stage.
#
# Each assertion is separately gated so a host opts into exactly the checks it
# can actually satisfy. A single umbrella flag would mean a host either declares
# the whole contract or none of it, and a host that cannot satisfy one item would
# quietly lose the others.
- name: Read Sing-box resident set size
  become: true
  ansible.builtin.shell:
    # VmRSS is in kB. `ps` is not used because its output format is not stable
    # across busybox and procps, and this has to work on both.
    cmd: |
      set -eu
      pid=$(pidof sing-box 2>/dev/null | awk '{print $1}')
      [ -n "$pid" ] || { echo 0; exit 0; }
      awk '/^VmRSS/{print $2; found=1} END{exit !found}' "/proc/${pid}/status" || echo 0
  register: singbox_native_rss_kb
  changed_when: false
  failed_when: false
  when: singbox_verify_rss_max_kb | default(0) | int > 0
  tags: [verify, services, singbox, phase5]

- name: Assert Sing-box resident set size is within the declared ceiling
  ansible.builtin.assert:
    that:
      - singbox_native_rss_kb.stdout | trim | int > 0
      - singbox_native_rss_kb.stdout | trim | int <= singbox_verify_rss_max_kb | int
    fail_msg: >-
      sing-box RSS is {{ singbox_native_rss_kb.stdout | trim | int }} kB, above the
      declared ceiling of {{ singbox_verify_rss_max_kb }} kB. A zero reading means
      the process was not found at all, which is a different failure and is
      reported as one rather than as a passing measurement.
  when: singbox_verify_rss_max_kb | default(0) | int > 0
  tags: [verify, services, singbox, phase5]

- name: Read Sing-box listening sockets
  become: true
  ansible.builtin.shell:
    # Both families, because the claim under test is about absence as much as
    # presence: "no UDP listener" cannot be established by listing TCP.
    cmd: |
      set -eu
      if command -v ss >/dev/null 2>&1; then
        ss -lntuH 2>/dev/null || true
      else
        netstat -lntu 2>/dev/null || true
      fi
  register: singbox_native_listeners
  changed_when: false
  failed_when: false
  when: singbox_verify_expected_tcp_ports is defined
  tags: [verify, services, singbox, phase5]

- name: Assert no unexpected TCP listener and no UDP listener at all
  ansible.builtin.assert:
    that:
      # Every configured inbound port is actually listening. Asserting only the
      # absence of extras would pass on a host where sing-box died and left
      # nothing bound.
      - (singbox_verify_expected_tcp_ports | map('int') | list) | difference(
          singbox_native_listeners.stdout
          | regex_findall('[:.]([0-9]{2,5})\s')
          | map('int') | list
        ) | length == 0
      # A UDP socket bound by sing-box means a protocol came back that this
      # profile retired. The Mesh transport is a userspace endpoint inside the
      # same process, so this cannot be satisfied by the tunnel itself -- see
      # singbox_verify_allow_udp_transport for the one documented exception.
      - singbox_verify_allow_udp_transport | default(false) | bool
        or singbox_native_listeners.stdout is not search('udp', true)
    fail_msg: >-
      Listener contract violated. Expected TCP ports
      {{ singbox_verify_expected_tcp_ports }}; observed:
      {{ singbox_native_listeners.stdout | default('') | truncate(400) }}
  when: singbox_verify_expected_tcp_ports is defined
  tags: [verify, services, singbox, phase5]

- name: Assert no retired protocol inbound is configured
  ansible.builtin.assert:
    that:
      - singbox_native_listeners.stdout is not search('LISTEN.*:' ~ item, true)
        or singbox_verify_expected_tcp_ports | default([]) | difference([item]) | length == 0
    fail_msg: >-
      Port {{ item }} is listening but is not part of the declared ingress
      contract for this profile.
  loop: "{{ singbox_verify_forbidden_ports | default([]) }}"
  when: singbox_verify_forbidden_ports is defined
  tags: [verify, services, singbox, phase5]

- name: Assert the mesh SOCKS ingress this guest needs is listening
  ansible.builtin.wait_for:
    host: "{{ singbox_mesh_socks_listen | default('127.0.0.1') }}"
    port: "{{ singbox_mesh_socks_port }}"
    state: started
    timeout: 5
  # Necessary but NOT sufficient: a bound socket says nothing about the tunnel. On
  # its own this check passes on a guest whose WireGuard handshake has never
  # completed. The data-path probe below is what actually tests the mesh.
  when:
    - singbox_mesh_socks_enabled | default(false) | bool
    - (singbox_mesh_socks_port | default('') | string | length) > 0
  tags: [verify, services, singbox, phase5]
- name: Install the mesh data-path probe onto the guest
  become: true
  ansible.builtin.copy:
    src: mesh_probe.py
    dest: "{{ singbox_native_workdir }}/mesh_probe.py"
    mode: "0755"
  when:
    - singbox_verify_mesh_probe_target | default('') | length > 0
    - not ansible_check_mode
  tags: [verify, services, singbox, phase5]

- name: Probe the mesh data path through the userspace tunnel
  become: true
  ansible.builtin.command:
    argv:
      - "{{ singbox_verify_mesh_probe_bin | default('/usr/bin/python3') }}"
      - "{{ singbox_native_workdir }}/mesh_probe.py"
      - --socks-host
      - "{{ singbox_mesh_socks_listen | default('127.0.0.1') }}"
      - --socks-port
      - "{{ singbox_mesh_socks_port | default(0) }}"
      - --target-host
      - "{{ singbox_verify_mesh_probe_target }}"
      - --target-port
      - "{{ singbox_verify_mesh_probe_port | default(0) }}"
      - --timeout
      - "{{ singbox_verify_mesh_probe_timeout | default(8) }}"
  register: singbox_native_mesh_probe
  changed_when: false
  when:
    - singbox_verify_mesh_probe_target | default('') | length > 0
    - singbox_mesh_socks_enabled | default(false) | bool
  tags: [verify, services, singbox, phase5]

# What this seam deliberately does NOT assert, stated here so the gap is visible
# in the role rather than only in a handoff:
#
#   * An inbound Reality handshake against an external client (#179 AC). A
#     self-referential handshake -- sing-box dialling its own Reality listener --
#     would prove the config parses and the socket accepts, which the tasks above
#     already cover. Counting that as the acceptance handshake would make a green
#     verify stage mean nothing.
#   * Throughput, and stop-the-world pause duration under load.
#   * WireGuard round-trip latency and loss to the hub.
#
# All four need the real guest. They are properties of a running host under a
# real 5 Mbps link and a real cgroup limit, and a role task cannot observe them
# without pretending to.
#
# On the mesh specifically: the SOCKS check above proves a listener is bound, and
# a guest can pass it with a completely dead tunnel -- no handshake, no hub peer
# entry, no packet delivered. It is a liveness check on this process, not on the
# mesh. #179's mesh AC stays unmet until the round trip is measured on the host.
