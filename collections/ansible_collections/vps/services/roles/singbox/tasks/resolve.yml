---
- name: Resolve singbox effective deployment mode
  ansible.builtin.set_fact:
    singbox_effective_mode: >-
      {{
        singbox_deploy_mode | lower
        if (singbox_deploy_mode | default('auto') | lower) in ['docker', 'native']
        else (
          'native'
          if (
            ansible_facts.distribution | default(ansible_distribution | default('')) == 'Alpine'
            or (ansible_memtotal_mb | default(1024)) < 512
          )
          else 'docker'
        )
      }}
  tags: [deploy, verify, rollback, rollback_verify, services, singbox, phase5]

- name: Validate singbox deployment mode
  ansible.builtin.assert:
    that:
      - singbox_effective_mode in ['native', 'docker']
    fail_msg: >-
      singbox_deploy_mode must be 'native' or 'docker', got '{{ singbox_deploy_mode }}'.
  tags: [deploy, verify, rollback, rollback_verify, services, singbox, phase5]

- name: Derive whether a Reality inbound is present
  ansible.builtin.set_fact:
    # A host whose nodes are all gateway/nginx-terminated (e.g. VLESS+WS behind
    # an InstaBox gateway) has no Reality listener; the verify task that waits
    # on the Reality port must be gated on this so it does not fail vacuously.
    singbox_has_reality_inbound: >-
      {{ (docker_apps_singbox_processed_nodes | default(singbox_nodes | default([])))
         + (singbox_extra_nodes | default([]))
         | selectattr('reality', 'default', true) | selectattr('reality')
         | rejectattr('behind_nginx', 'default', false) | rejectattr('behind_nginx')
         | rejectattr('behind_gateway', 'default', false) | rejectattr('behind_gateway')
         | list | length > 0 }}
  tags: [deploy, verify, rollback, rollback_verify, services, singbox, phase5]
