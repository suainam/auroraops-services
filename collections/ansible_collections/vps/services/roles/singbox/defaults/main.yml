---
singbox_enabled: true
singbox_deploy_mode: auto

# Zero-rule mode: no remote rule_set downloads/parsing, no FakeIP DNS, no
# ruleset DNS rules. The default outbound stays direct-out and Mesh/private/
# Relay routing is untouched. Off by default so every non-NAT node keeps its
# full rules.
docker_apps_singbox_zero_rules: false

# Image and Binary
singbox_image: "ghcr.io/sagernet/sing-box:v1.13.21"
singbox_version: "1.13.11"

# Verification seam (#179). All zero/off by default so every existing host runs
# exactly the checks it ran before; a host opts into each one it can satisfy.
#
# RSS ceiling in kB. Zero disables the check. A host declares its own budget
# rather than inheriting one, because a ceiling that is wrong for the host is
# worse than no ceiling: it either fails a healthy node or passes an unhealthy
# one.
singbox_verify_rss_max_kb: 0
# The TCP ports this profile is allowed to expose. Defining this key is what
# enables the listener contract check.
singbox_verify_expected_tcp_ports: []
# Ports belonging to a protocol this profile has retired. Asserted absent so a
# resurrected inbound cannot pass unnoticed.
singbox_verify_forbidden_ports: []
# A userspace WireGuard endpoint keeps one ephemeral UDP socket open to the hub.
# That is a transport socket, not a listener. Set this on a host where the
# "no UDP listener" assertion would otherwise fail for that reason -- which is the
# honest way to record it, because the alternative is weakening the assertion for
# everyone.
singbox_verify_allow_udp_transport: false

# Directory Structure
singbox_config_dir: "/opt/dockers/singbox/config"
singbox_data_dir: "/opt/dockers/singbox"
singbox_native_config_dir: "/etc/sing-box"
singbox_native_workdir: "/var/lib/sing-box"

# Networking Ports
singbox_reality_port: 30052
singbox_hysteria_port: 30051
singbox_relay_reality_port: 30054
singbox_relay_hysteria_port: 30053
singbox_web_port: 10080

# Role and Domain
singbox_role: "direct"
singbox_domain: ""
docker_apps_singbox_certificate_domain: "suai.eu.org"

# Reality Settings
singbox_reality_sni_candidates:
  - www.cloudflare.com
  - www.microsoft.com
singbox_reality_short_id_count: 8

# Optional authenticated SOCKS5 exits: tag, server, server_port, username,
# password. Store credentials in the controller's Vault.
singbox_socks_outbounds: []
# A VLESS extra node may set shared_inbound to a primary VLESS node's name.
# It must use that listener's port/SNI/Reality settings and a unique UUID/name;
# relay_outbound selects its fixed exit by auth_user, without another listener.

# Slim binary for memory-constrained guests. The Alpine package is a 46 MiB
# universal binary; unpacking it inside a 64 MiB guest's cgroup gets the install
# OOM-killed, which leaves an OpenRC init script with no binary behind it.
# When enabled, the native branch installs the supplied binary instead of
# managing the distro package. Off by default: every other node is unaffected.
singbox_native_custom_binary: false
# Controller-side path or URL of the prebuilt binary.
singbox_native_slim_source: ""
# Required when custom_binary is on. The install refuses to run without it --
# silently falling back to apk is exactly what OOMs the guest.
singbox_native_slim_sha256: ""

# WireGuard Userspace Guard
singbox_wireguard_enabled: false
singbox_wireguard_system: false
singbox_wireguard_http_inbound: false
# No default. This was 30059, which is the port being given up by the retired
# residential proxy (#40) -- so the sing-box WireGuard outbound defaulted to a
# port that means something else entirely, and would have kept dialling it after
# the reassignment without reporting anything. The hub's real port is the
# authority's concern: wireguard_udp_ports.hub, overridden per host where the
# provider forces it (cc15 is pinned to 30071). If sing-box's own WireGuard
# outbound is ever re-enabled, it must be given that value explicitly.
singbox_wireguard_server_port: ""
# Likewise undeclared rather than defaulted. It had no default at all, so
# `| default(10080)` in the template was the only definition of the port --
# a number living in a template with no owner and no way to find it. Both
# values are empty on purpose: this endpoint is only rendered when
# singbox_wireguard_enabled is true, and an empty value makes a mistake fail
# loudly instead of quietly dialling 10080 at somebody.
singbox_wireguard_http_port: ""
singbox_wireguard_allowed_ips: ["10.144.10.0/24"]
singbox_wireguard_keepalive: 25
# Empty on purpose. A private key that lives in the repository is a key every
# host reading it shares, and the repository's own copy goes stale the moment a
# host regenerates -- which is how Issue #140 became unresolvable: the stored
# key no longer derived the stored public key beside it. Left empty, the role
# generates one on the host and only the public half is ever registered. Supply
# a value here only to pin a specific key; otherwise the host owns it.
singbox_wireguard_private_key: ""
# Owner-only. sing-box is invoked with -C (directory mode) and reads *.json, so
# a .key file sitting beside the fragments is inert to it -- the key is read by
# this role at render time and never shipped as a separate config input.
singbox_wireguard_private_key_file: "{{ singbox_native_config_dir }}/wg_priv.key"
# A loopback SOCKS inbound is the only way a process on one of these guests can
# originate mesh traffic. They have no CAP_NET_ADMIN and no /dev/net/tun, so a
# tun inbound cannot exist, and the host's own routing table never learns the
# mesh -- a shell curl to 10.144.10.1 is answered by the default gateway and
# times out no matter how healthy the tunnel is. Without an inbound, sing-box
# only ever sees traffic that arrived from a remote client, so the mesh can
# carry keepalives and nothing else.
#
# Loopback-only, deliberately. These are residential nodes on consumer ISPs;
# an unauthenticated SOCKS listener bound to a public interface is an open
# proxy, and the role refuses a non-loopback listen for that reason rather than
# trusting the caller's inventory to stay sensible.
singbox_mesh_socks_enabled: false
singbox_mesh_socks_listen: "127.0.0.1"
# No default, matching singbox_wireguard_http_port above: the port is the
# authority's decision (ports.yml), and an empty value should fail loudly
# instead of quietly binding something already in use.
singbox_mesh_socks_port: ""
