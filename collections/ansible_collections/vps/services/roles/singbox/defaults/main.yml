---
singbox_enabled: true
singbox_deploy_mode: auto

# Image and Binary
singbox_image: "ghcr.io/sagernet/sing-box:v1.13.21"
singbox_version: "1.13.11"

# Directory Structure
singbox_config_dir: "/opt/dockers/singbox/config"
singbox_data_dir: "/opt/dockers/singbox"
singbox_native_config_dir: "/etc/sing-box"
singbox_native_workdir: "/var/lib/sing-box"

# Networking Ports
singbox_reality_port: 30052
singbox_hysteria_port: 30051
singbox_relay_reality_port: 30054
singbox_relay_hysteria_port: 30053
singbox_web_port: 10080

# Role and Domain
singbox_role: "direct"
singbox_domain: ""
docker_apps_singbox_certificate_domain: "suai.eu.org"

# Reality Settings
singbox_reality_sni_candidates:
  - www.cloudflare.com
  - www.microsoft.com
singbox_reality_short_id_count: 8

# WireGuard Userspace Guard
singbox_wireguard_enabled: false
singbox_wireguard_system: false
singbox_wireguard_http_inbound: false
# No default. This was 30059, which is the port being given up by the retired
# residential proxy (#40) -- so the sing-box WireGuard outbound defaulted to a
# port that means something else entirely, and would have kept dialling it after
# the reassignment without reporting anything. The hub's real port is the
# authority's concern: wireguard_udp_ports.hub, overridden per host where the
# provider forces it (cc15 is pinned to 30071). If sing-box's own WireGuard
# outbound is ever re-enabled, it must be given that value explicitly.
singbox_wireguard_server_port: ""
# Likewise undeclared rather than defaulted. It had no default at all, so
# `| default(10080)` in the template was the only definition of the port --
# a number living in a template with no owner and no way to find it. Both
# values are empty on purpose: this endpoint is only rendered when
# singbox_wireguard_enabled is true, and an empty value makes a mistake fail
# loudly instead of quietly dialling 10080 at somebody.
singbox_wireguard_http_port: ""
singbox_wireguard_allowed_ips: ["10.144.10.0/24"]
singbox_wireguard_keepalive: 25
