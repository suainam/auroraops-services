---
# Pre-pull images for the containers this host actually runs.
#
# The old list was a flat name/image/enabled triple per application, and its
# enabled flags defaulted to true for applications most hosts no longer run
# (gcli2api, flare, singbox, newapi_suite, shellcrash, ...), so a host such as
# cc15 fetched a dozen images it never starts.
#
# The selection is now driven by the same variable docker_apps uses to decide
# what to deploy: docker_apps_containers = global + host - exclude. That is the
# host's real deployment list, so the pull set and the deploy set cannot drift.
#
# docker_apps only merges that list in phase5, while this role runs in phase3,
# so the merge is repeated here against the same helper and the same inputs.
- name: "合并 Docker Apps 容器列表 (与 phase5 同一规则)"
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/merge_list_vars.yml"
  vars:
    merge_var_name: docker_apps_containers
  when: auroraops_roles['services']['docker_apps'] | default(true) | bool
  tags: [deploy, services, docker, docker_prepull, phase3]

- name: "构造本机实际运行容器的镜像映射"
  ansible.builtin.set_fact:
    docker_prepull_images: >-
      {{
        {
          'sub_store': sub_store_image,
          'magpie': docker_apps_magpie_image | default(magpie_image | default('')),
          'workbuddy2api': docker_apps_workbuddy2api_image | default(workbuddy2api_image | default('')),
          'ai_memory': docker_apps_ai_memory_image | default(ai_memory_image | default('')),
          'vaultwarden': vaultwarden_image | default(''),
          'sillytavern': sillytavern_image | default(''),
          'gcli2api': gcli2api_image | default(''),
          'ds2api': ds2api_image | default(''),
          'flare': flare_image | default(''),
          'singbox': singbox_image | default(''),
          'newapi_suite': newapi_image | default(''),
          'shellcrash': shellcrash_image | default(''),
          'gemini_balance': gemini_balance_image | default(''),
          'manifest': manifest_image | default(''),
          'vertex': docker_apps_vertex_image | default(vertex_image | default('')),
        }
        | dict2items
        | selectattr('value', 'ne', '')
        | selectattr('key', 'in', docker_apps_containers | default([]))
        | list
      }}
  when: auroraops_roles['services']['docker_apps'] | default(true) | bool
  tags: [deploy, services, docker, docker_prepull, phase3]

- name: "Docker 智能预拉取 (仅本机实际运行的容器)"
  community.docker.docker_image:
    name: "{{ item.value }}"
    source: pull
  loop: "{{ docker_prepull_images | default([]) }}"
  when:
    - not ansible_check_mode
    # Sub-Store keeps its own refresh cadence; it must not be pulled here.
    - item.key != 'sub_store' or (docker_apps_sub_store_enabled | default(false) | bool)
  async: 600
  poll: 0
  changed_when: false # 异步预拉取作为后台优化任务，不视为配置变更
  register: docker_prepull_jobs
  tags: [deploy, services, docker, docker_prepull, phase3]

- name: "确认后台预拉取任务已提交"
  ansible.builtin.debug:
    msg: "已为启用项开启后台预拉取任务"
  changed_when: false
  when: (docker_prepull_jobs.results | default([])) | length > 0
  tags: [deploy, services, docker, docker_prepull, phase3]
