# tasks/configure.yml
---
- name: Deploy Docker daemon configuration
  become: true
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart Docker service
  tags: [deploy, services, docker, docker_config, phase3]

- name: Check if UFW exists
  ansible.builtin.stat:
    path: /etc/ufw/after.rules
  register: docker_ufw_after_rules_exists
  tags: [deploy, services, docker, firewall, phase3]

- name: Ensure destructive UFW-Docker compatibility blocks are removed from after.rules
  become: true
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBLE MANAGED BLOCK: DOCKER-USER RULES"
    state: absent
  when: docker_ufw_after_rules_exists.stat.exists
  tags: [deploy, services, docker, firewall, phase3]

- name: Ensure docker group exists
  become: true
  ansible.builtin.group:
    name: docker
    state: present
  tags: [deploy, services, docker, docker_config, phase3]

- name: Add users to docker group
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker__users }}"
  when: item != 'root'
  tags: [deploy, services, docker, docker_config, phase3]

- name: Configure Docker and Backup logrotate
  ansible.builtin.import_tasks: logrotate.yml
  tags: [deploy, services, docker, logrotate, phase3]

- name: Apply systemd priority drop-ins for Docker engine units
  become: true
  block:
    - name: Ensure Docker engine unit drop-in directory exists
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item.key }}.service.d"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: "{{ docker_systemd_priority | dict2items }}"

    - name: Render Docker engine systemd priority drop-in
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.key }}.service.d/priority.conf"
        content: |
          [Service]
          # Managed by AuroraOps: vps.services.docker
          {% if item.value.nice is defined and item.value.nice != None %}
          Nice={{ item.value.nice }}
          {% endif %}
          {% if item.value.cpu_weight is defined and item.value.cpu_weight %}
          CPUWeight={{ item.value.cpu_weight }}
          {% endif %}
          {% if item.value.io_weight is defined and item.value.io_weight %}
          IOWeight={{ item.value.io_weight }}
          {% endif %}
          {% if item.value.timeout_stop_sec is defined and item.value.timeout_stop_sec %}
          TimeoutStopSec={{ item.value.timeout_stop_sec }}
          {% endif %}
        owner: root
        group: root
        mode: '0644'
      loop: "{{ docker_systemd_priority | dict2items }}"
      register: _docker_priority_dropins

    - name: Reload systemd to pick up Docker priority drop-ins
      ansible.builtin.systemd:
        daemon_reload: true
      when: _docker_priority_dropins.changed
  when: docker_systemd_priority | length > 0
  tags: [deploy, services, docker, docker_config, phase3]
