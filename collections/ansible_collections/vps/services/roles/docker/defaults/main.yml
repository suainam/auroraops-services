---
# 默认将 admin 用户和当前 ansible 用户添加到 docker 组
docker__users:
  - "{{ admin_user | default('admin') }}"
  - "{{ ansible_user | default(lookup('env', 'USER')) }}"

# 修复 nickjj.docker 在新版 Ansible 中的布尔判断问题
docker__version: false
docker__compose_v2_version: false
docker__install_compose_plugin: true
docker__channel: stable
docker__edition: ce

# 显式置空以避免循环逻辑错误
docker__pip_dependencies: []
docker__pip_virtualenv_packages: []
docker__default_pip_dependencies: []
docker__default_pip_virtualenv_packages: []

# Docker 容器日志由 daemon.json 的 json-file max-size/max-file 负责轮转；
# 备份产物轮转随 legacy unified-backup 一并退役，此处保持空列表。
docker_logrotate_configs: []
docker__daemon_options:
  log-driver: "json-file"
  log-opts:
    max-size: "10m"
    max-file: "3"
  "live-restore": true
  "no-new-privileges": true
  # 国内镜像源配置 (当 use_domestic_mirrors 为 true 时启用)
  "registry-mirrors": >-
    {{
      [
        'https://docker.mirrors.ustc.edu.cn',
        'https://hub-mirror.c.163.com',
        'https://docker.fnnas.com',
        'https://registry.hub.docker.com',
        'https://dockerproxy.com',
        'https://mirror.baidubce.com',
        'https://docker.m.daocloud.io',
        'https://docker.nju.edu.cn',
        'https://docker.mirrors.sjtug.sjtu.edu.cn',
        'https://ghcr.nju.edu.cn',
        'https://docker.pullfree.pw',
        'https://docker.1panel.live',
        'https://docker.unlimit.soft'
      ] | unique
      if use_domestic_mirrors | default(false)
      else []
    }}

# Docker lifecycle state: 'present' (default) or 'absent' (opt-in retirement)
docker_state: present

# Docker retirement preflight and safety controls
docker_retirement_require_no_running_containers: true
docker_retirement_required_active_services: []
docker_retirement_require_standby_snapshot: false
docker_retirement_standby_latest_path: /opt/vaultwarden-standby/latest.json
docker_retirement_standby_script_path: /usr/local/sbin/vaultwarden_standby.py

# Exact packages to inspect and remove during retirement (no autoremove / no purge)
docker_retirement_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - docker-ce-rootless-extras

# Allowed package removals in APT simulation.
# If APT simulate attempts to remove any package NOT in this list, retirement aborts.
docker_retirement_allowed_removal_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - docker-ce-rootless-extras
  - runc

# Recovery baseline fact path
docker_retirement_fact_path: /etc/ansible/facts.d/docker_retirement.fact
docker_retirement_preserve_data: true
