---
# defaults/main.yml for vps.services.cliproxyapi_native

# Role enable toggle (must be true AND enabled in auroraops_roles.services.cliproxyapi_native)
cliproxyapi_native_enabled: true

# Upstream release version (router-for-me/CLIProxyAPI)
cliproxyapi_native_version: "v7.3.9"

# Installation and persistence directories
cliproxyapi_native_install_dir: "/opt/cliproxyapi"
cliproxyapi_native_data_dir: "/opt/cliproxyapi/data"

# Service listening address
cliproxyapi_native_bind_address: "127.0.0.1:30011"
cliproxyapi_native_bind_host: "{{ cliproxyapi_native_bind_address.split(':')[0] | default('127.0.0.1') }}"
cliproxyapi_native_bind_port: "{{ (cliproxyapi_native_bind_address.split(':')[1] | default('30011')) | int }}"

# Scheduled daily restart (hour in 24h format, Asia/Shanghai or local)
cliproxyapi_native_restart_hour: "04"
cliproxyapi_native_restart_schedule: "*-*-* {{ cliproxyapi_native_restart_hour }}:00:00"

# Runtime memory limit and outbound HTTP proxy
cliproxyapi_native_gomemlimit: "220MiB"
cliproxyapi_native_http_proxy: ""
cliproxyapi_native_proxy_url: "http://127.0.0.1:12346"
cliproxyapi_native_download_proxy: "http://127.0.0.1:12346"

# Secrets and keys reused from existing vault variables
cliproxyapi_native_allow_remote: true
cliproxyapi_native_management_key: "{{ cliproxyapi_management_key | default('') }}"
cliproxyapi_native_api_keys: "{{ docker_apps_cliproxyapi_api_keys | default(cliproxyapi_api_keys | default([])) }}"

# Verification key for health checks (uses first available api key)
cliproxyapi_native_test_api_key: "{{ (cliproxyapi_native_api_keys | default([]) | first) | default('') }}"

# Architecture mapping to release binary names (strictly supported architectures only)
cliproxyapi_native_arch_map:
  aarch64: "linux_aarch64"
  arm64: "linux_aarch64"
  x86_64: "linux_amd64"
  amd64: "linux_amd64"

# Official checksums verified from GitHub release checksums.txt (v7.3.9)
cliproxyapi_native_checksums:
  aarch64: "sha256:827d7b8fb43a137898f7b68ceb6ff1aefcd0528cd5d59ea61317251171832b75"
  arm64: "sha256:827d7b8fb43a137898f7b68ceb6ff1aefcd0528cd5d59ea61317251171832b75"
  x86_64: "sha256:fd45e915d84e40fc09cefaae6b271a59d542bf284fd3dfee38abe5472412427b"
  amd64: "sha256:fd45e915d84e40fc09cefaae6b271a59d542bf284fd3dfee38abe5472412427b"

# Provider and auth credential paths (defaults to repo secrets if present)
cliproxyapi_native_ai_providers_file: "{{ cliproxyapi_ai_providers_file | default(inventory_dir ~ '/../secrets/cliproxyapi_ai_providers.yml') }}"
cliproxyapi_native_auths_dir: "{{ cliproxyapi_auths_dir | default(inventory_dir ~ '/../secrets/cliproxyapi_auths') }}"

# Direct routing overrides (bypass global proxy-url for specific providers)
cliproxyapi_native_direct_providers: "{{ cliproxyapi_direct_providers | default([]) }}"
cliproxyapi_native_direct_claude: "{{ cliproxyapi_direct_claude | default(false) }}"

# Advanced routing and runtime tuning (aligned with production qqg1299)
cliproxyapi_native_commercial_mode: true
cliproxyapi_native_logs_max_total_size_mb: 5
cliproxyapi_native_max_retry_interval: 10
cliproxyapi_native_routing_strategy: "weighted-round-robin"
cliproxyapi_native_session_affinity: true
cliproxyapi_native_ws_auth: true
cliproxyapi_native_disable_image_generation: "passthrough"
cliproxyapi_native_stabilize_device_profile: true

# OAuth excluded models (filter out redundant, deprecated, or unwanted thinking variants)
cliproxyapi_native_oauth_excluded_models:
  antigravity:
    - "claude-opus-4-6-thinking"
    - "gemini-3.6-flash-high"
    - "gemini-3.1-flash-lite"
    - "gpt-oss-120b-medium"
    - "gemini-3.1-pro-low"
    - "gemini-3-flash"
  claude:
    - "claude-haiku-4-5-20251001"
    - "claude-sonnet-4-5-20250929"
    - "claude-opus-4-6"
    - "claude-opus-4-7"
    - "claude-opus-4-5-20251101"
    - "claude-opus-4-1-20250805"
    - "claude-opus-4-20250514"
    - "claude-sonnet-4-20250514"
    - "claude-3-7-sonnet-20250219"
    - "claude-3-5-haiku-20241022"
  codex:
    - "gpt-5.5"
    - "gpt-5.6-sol"
    - "gpt-5.6-terra"
    - "gpt-5.6-luna"
