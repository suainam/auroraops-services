---
- name: Load private CLIProxyAPI AI Provider seed when present
  ansible.builtin.include_vars:
    file: "{{ cliproxyapi_native_ai_providers_file }}"
  no_log: true
  when:
    - cliproxyapi_native_ai_providers_file | default('', true) | length > 0
    - query('ansible.builtin.fileglob', cliproxyapi_native_ai_providers_file | default('', true)) | length > 0
  tags: [deploy, services, cliproxyapi_native, cliproxyapi_native_config, phase5]

- name: Deploy CLIProxyAPI OAuth credentials when present
  become: true
  no_log: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ cliproxyapi_native_data_dir }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0600"
  with_fileglob:
    - "{{ cliproxyapi_native_auths_dir }}/*.json"
  notify: Restart cliproxyapi-native.service
  tags: [deploy, services, cliproxyapi_native, cliproxyapi_native_config, phase5]

- name: Deploy CLIProxyAPI runtime configuration
  become: true
  no_log: true
  ansible.builtin.template:
    src: cliproxyapi_config.yaml.j2
    dest: "{{ cliproxyapi_native_install_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0600"
  notify: Restart cliproxyapi-native.service
  tags: [deploy, services, cliproxyapi_native, cliproxyapi_native_config, phase5]

- name: Deploy CLIProxyAPI systemd service unit
  become: true
  ansible.builtin.template:
    src: cliproxyapi-native.service.j2
    dest: /etc/systemd/system/cliproxyapi-native.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart cliproxyapi-native.service
  tags: [deploy, services, cliproxyapi_native, cliproxyapi_native_config, phase5]

- name: Deploy CLIProxyAPI scheduled restart companion service unit
  become: true
  ansible.builtin.template:
    src: cliproxyapi-restart.service.j2
    dest: /etc/systemd/system/cliproxyapi-restart.service
    owner: root
    group: root
    mode: "0644"
  tags: [deploy, services, cliproxyapi_native, cliproxyapi_native_config, phase5]

- name: Deploy CLIProxyAPI scheduled restart timer unit
  become: true
  ansible.builtin.template:
    src: cliproxyapi-restart.timer.j2
    dest: /etc/systemd/system/cliproxyapi-restart.timer
    owner: root
    group: root
    mode: "0644"
  notify: Restart cliproxyapi-restart.timer
  tags: [deploy, services, cliproxyapi_native, cliproxyapi_native_config, phase5]

- name: Ensure CLIProxyAPI service is enabled and started
  become: true
  ansible.builtin.systemd:
    name: cliproxyapi-native.service
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
  tags: [deploy, services, cliproxyapi_native, cliproxyapi_native_config, phase5]

- name: Ensure CLIProxyAPI restart timer is enabled and started
  become: true
  ansible.builtin.systemd:
    name: cliproxyapi-restart.timer
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode
  tags: [deploy, services, cliproxyapi_native, cliproxyapi_native_config, phase5]

- name: Restart CLIProxyAPI service if binary was upgraded or newly installed
  become: true
  ansible.builtin.systemd:
    name: cliproxyapi-native.service
    state: restarted
  when:
    - not ansible_check_mode
    - cliproxyapi_native_needs_install | default(false) | bool
  tags: [deploy, services, cliproxyapi_native, cliproxyapi_native_config, phase5]

- name: Flush handlers to ensure service is restarted before verification
  ansible.builtin.meta: flush_handlers
  tags: [deploy, services, cliproxyapi_native, cliproxyapi_native_config, phase5]
