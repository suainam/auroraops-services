---
- name: "[Certbot] Remove Certbot DNS credentials file on rollback (preserving issued TLS certificates per AGENTS.md)"
  become: true
  ansible.builtin.file:
    path: "{{ certbot_dns_credentials_file }}"
    state: absent
  when: certbot_create_method == 'dns' and certbot_dns_plugin is defined
  tags:
    - rollback
    - services
    - certbot
    - certbot_remove_credentials_file
    - phase3

- name: "[Certbot] Remove Certbot logrotate configuration on rollback"
  become: true
  ansible.builtin.file:
    path: "{{ certbot_logrotate_config_path }}"
    state: absent
  tags:
    - rollback
    - services
    - certbot
    - certbot_remove_logrotate_config
    - phase3
