---
- name: Ensure data directories exist
  become: true
  ansible.builtin.file:
    path: "{{ container_deployer_base_path }}/{{ container_deployer_name }}/{{ item }}"
    state: directory
    mode: "{{ container_deployer_dir_mode }}"
    owner: "{{ container_deployer_dir_owner }}"
    group: "{{ container_deployer_dir_group }}"
  loop: "{{ container_deployer_dirs }}"
  when: container_deployer_dirs | length > 0
  tags: [deploy, services, container_deployer, phase5]

- name: Initialize data from image
  become: true
  ansible.builtin.shell: |
    docker run --rm --entrypoint sh \
      -v "{{ container_deployer_base_path }}/{{ container_deployer_name }}/{{ item }}:/tmp/dest" \
      "{{ container_deployer_image }}" \
      -c "if [ -d {{ container_deployer_init_container_path }}/{{ item }} ]; then
          cp -an {{ container_deployer_init_container_path }}/{{ item }}/. /tmp/dest/ 2>/dev/null || true;
        fi"
  loop: "{{ container_deployer_init_dirs }}"
  changed_when: false
  when:
    - container_deployer_init_enabled
    - container_deployer_init_dirs | length > 0
  tags: [deploy, services, container_deployer, phase5]

- name: Fix permissions
  become: true
  ansible.builtin.file:
    path: "{{ container_deployer_base_path }}/{{ container_deployer_name }}"
    state: directory
    owner: "{{ container_deployer_fix_uid }}"
    group: "{{ container_deployer_fix_gid }}"
    mode: "{{ container_deployer_fix_mode }}"
    recurse: true
  when: container_deployer_fix_permissions
  tags: [deploy, services, container_deployer, phase5]
