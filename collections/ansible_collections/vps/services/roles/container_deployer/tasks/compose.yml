---
- name: Ensure compose directory exists
  ansible.builtin.file:
    path: "{{ container_deployer_base_path }}/{{ container_deployer_name }}"
    state: directory
    mode: "0755"
  tags: [deploy, services, container_deployer, phase5]

- name: Expose Compose template variables
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ container_deployer_compose_vars | dict2items }}"
  when: container_deployer_compose_vars | length > 0
  no_log: true
  tags: [deploy, services, container_deployer, phase5]

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: "{{ container_deployer_compose_template }}"
    dest: "{{ container_deployer_base_path }}/{{ container_deployer_name }}/docker-compose.yml"
    mode: "0644"
  # Compose templates are rendered from cdp_compose_vars, which can carry
  # secrets (for example manifest's BETTER_AUTH_SECRET). `make check` runs
  # --check --diff, so without this the rendered secret is printed in plaintext.
  no_log: "{{ not (container_deployer_debug | bool | default(false)) }}"

- name: Deploy compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ container_deployer_base_path }}/{{ container_deployer_name }}"
    build: "{{ container_deployer_compose_build }}"
    pull: "{{ container_deployer_compose_pull }}"
    remove_orphans: "{{ container_deployer_compose_remove_orphans }}"
    state: present
  # Compose stacks are templated from cdp_env as well; keep secrets out of the log.
  no_log: "{{ not (container_deployer_debug | bool | default(false)) }}"
  notify: Restart compose stack
  tags: [deploy, services, container_deployer, phase5]
