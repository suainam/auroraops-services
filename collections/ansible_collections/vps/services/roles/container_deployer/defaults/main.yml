---
# Internal normalized variables. Existing callers may continue passing cdp_*.
container_deployer_docker_apps_path: "{{ docker_apps_path | default('/root/AuroraOps/collections/ansible_collections/vps/services/roles/docker_apps') }}"
container_deployer_name: "{{ cdp_name | default('') }}"
container_deployer_image: "{{ cdp_image | default('') }}"
container_deployer_dirs: "{{ cdp_dirs | default([]) }}"
container_deployer_base_path: "{{ cdp_base_path | default('/opt/dockers') }}"
container_deployer_dir_owner: "{{ cdp_dir_owner | default('root') }}"
container_deployer_dir_group: "{{ cdp_dir_group | default('root') }}"
container_deployer_dir_mode: "{{ cdp_dir_mode | default('0755') }}"
container_deployer_init_enabled: "{{ cdp_init_enabled | default(false) }}"
container_deployer_init_dirs: "{{ cdp_init_dirs | default([]) }}"
container_deployer_init_container_path: "{{ cdp_init_container_path | default('/app') }}"
container_deployer_fix_permissions: "{{ cdp_fix_permissions | default(false) }}"
container_deployer_fix_uid: "{{ cdp_fix_uid | default(docker_user_uid | default(1000)) }}"
container_deployer_fix_gid: "{{ cdp_fix_gid | default(docker_user_gid | default(1000)) }}"
container_deployer_fix_mode: "{{ cdp_fix_mode | default('0777') }}"
container_deployer_networks: "{{ cdp_networks | default([]) }}"
container_deployer_dns: "{{ cdp_dns | default([]) }}"
container_deployer_network_mode: "{{ cdp_network_mode | default('') }}"
container_deployer_ports: "{{ cdp_ports | default([]) }}"
container_deployer_volumes: "{{ cdp_volumes | default([]) }}"
container_deployer_env: "{{ cdp_env | default({}) }}"
container_deployer_env_file: "{{ cdp_env_file | default('') }}"
container_deployer_command: "{{ cdp_command | default('') }}"
container_deployer_user: "{{ cdp_user | default('') }}"
container_deployer_working_dir: "{{ cdp_working_dir | default('') }}"
container_deployer_etc_hosts: "{{ cdp_etc_hosts | default({}) }}"
container_deployer_devices: "{{ cdp_devices | default([]) }}"
container_deployer_capabilities: "{{ cdp_capabilities | default([]) }}"
container_deployer_privileged: "{{ cdp_privileged | default(false) }}"
container_deployer_memory: "{{ cdp_memory | default('512m', true) }}"
container_deployer_cpu_shares: "{{ cdp_cpu_shares | default('') }}"
container_deployer_cpus: "{{ cdp_cpus | default('1.0', true) }}"
container_deployer_shm_size: "{{ cdp_shm_size | default('') }}"
container_deployer_memory_reservation: "{{ cdp_memory_reservation | default('128m', true) }}"
container_deployer_oom_score_adj: "{{ cdp_oom_score_adj | default('') }}"
container_deployer_restart_policy: "{{ cdp_restart_policy | default('always') }}"
container_deployer_state: "{{ cdp_state | default('started') }}"
container_deployer_recreate: "{{ cdp_recreate | default(false) }}"
container_deployer_pull: "{{ cdp_pull | default(true) }}"
container_deployer_cdp_pull: "{{ cdp_pull | default(true) }}"
container_deployer_healthcheck: "{{ cdp_healthcheck | default({}) }}"
container_deployer_healthcheck_min_interval: "1800s"
# Escape hatch for the no_log guards on the deploy tasks. Leave false in
# production; set true only to read a failure that no_log would otherwise hide.
container_deployer_debug: false

container_deployer_log_driver: "{{ cdp_log_driver | default('json-file') }}"
container_deployer_log_options: "{{ cdp_log_options | default({'max-size': '5m', 'max-file': '3'}) }}"
container_deployer_compose_enabled: "{{ cdp_compose_enabled | default(false) }}"
container_deployer_compose_template: "{{ cdp_compose_template | default('') }}"
container_deployer_compose_vars: "{{ cdp_compose_vars | default({}) }}"
container_deployer_compose_build: "{{ cdp_compose_build | default(false) }}"
container_deployer_compose_pull: "{{ cdp_compose_pull | default('missing') }}"
container_deployer_compose_remove_orphans: "{{ cdp_compose_remove_orphans | default(false) }}"
container_deployer_compose_restart_after_deploy: "{{ cdp_compose_restart_after_deploy | default(true) }}"
container_deployer_pre_tasks: "{{ cdp_pre_tasks | default([]) }}"
container_deployer_post_tasks: "{{ cdp_post_tasks | default([]) }}"
