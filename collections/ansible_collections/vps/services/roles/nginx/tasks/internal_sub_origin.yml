---
# Read-only subscription origin for mesh-only NAT nodes (#137 / #178).
#
# A NAT node with no public HTTP entry pushes its rendered profile.yaml into a
# restricted directory here, and Sub-Store fetches it from an nginx alias bound to
# the container bridge. This replaces a per-node plaintext nginx relay that cost
# 15-25 MiB resident each.
#
# Why a file and an alias rather than a writable API on the aggregator: a writable
# API would hand every mesh peer the ability to rewrite the provider catalog,
# which is a larger exposure than the relay it replaces. Files plus a read-only
# alias means the mesh can deliver a subscription and nothing else.
#
# Gated on the same declaration cc15 already carries, so a host without it is
# untouched.

- name: Resolve whether this host serves the internal subscription origin
  ansible.builtin.set_fact:
    nginx_internal_sub_enabled: >-
      {{ (sub_store_internal_listen_enabled | default(false) | bool)
         and (nginx_internal_sub_root | default('') | length > 0) }}
  tags: [deploy, services, nginx, nginx_site_config, phase4]

- name: Report disabled internal subscription origin
  ansible.builtin.debug:
    msg: "Internal subscription origin is not declared; skipping"
  when: not nginx_internal_sub_enabled | bool
  tags: [deploy, services, nginx, nginx_site_config, phase4]

- name: Ensure the internal subscription root exists
  become: true
  ansible.builtin.file:
    path: "{{ nginx_internal_sub_root }}"
    state: directory
    # Traversal-only for nginx's worker, which only ever reads these files. The
    # group comes from this role's own nginx_user default rather than a literal so
    # an Alpine host (workers run as `nginx`) does not get a directory the worker
    # cannot traverse.
    owner: "root"
    group: "{{ nginx_user }}"
    mode: "0750"
  when: nginx_internal_sub_enabled | bool
  tags: [deploy, services, nginx, nginx_site_config, phase4]

# Deployed to conf.d under the name the live file already uses. Writing a
# sites-available file plus a symlink would put a second server block on the same
# listen addresses with the same server_name: nginx accepts that, the first block
# wins, and the deployed file would be inert. Taking over the existing path is the
# only way this role can own the configuration rather than shadow it.
- name: Render the internal subscription origin site
  become: true
  ansible.builtin.template:
    src: internal_sub_alias.conf.j2
    dest: "{{ nginx_internal_sub_conf }}"
    mode: "0644"
  when: nginx_internal_sub_enabled | bool
  notify: reload nginx
  tags: [deploy, services, nginx, nginx_site_config, phase4]


- name: Ensure nginx.service.d directory exists for internal sub origin self-healing
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - nginx_internal_sub_enabled | bool
    - (ansible_facts.service_mgr | default('systemd')) == 'systemd'
  tags: [deploy, services, nginx, nginx_site_config, phase4]

- name: Configure nginx systemd drop-in for virtual interface ordering and docker0 IP self-healing
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/nginx.service.d/internal-sub-deps.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by AuroraOps: vps.services.nginx (internal_sub_origin)
      [Unit]
      After=network-online.target docker.service wg-quick@wg0.service
      Wants=network-online.target

      [Service]
      ExecStartPre=-/usr/sbin/sysctl -w net.ipv4.ip_nonlocal_bind=1
      ExecStartPre=-/bin/sh -c 'ip link show docker0 >/dev/null 2>&1 && ! ip -4 addr show dev docker0 | grep -q {{ sub_store_internal_listen_address | default("172.17.0.1") }} && ip addr add {{ sub_store_internal_listen_address | default("172.17.0.1") }}/16 dev docker0 || true'
      Restart=on-failure
      RestartSec=5s
  register: nginx_internal_sub_dropin
  when:
    - nginx_internal_sub_enabled | bool
    - (ansible_facts.service_mgr | default('systemd')) == 'systemd'
  tags: [deploy, services, nginx, nginx_site_config, phase4]

- name: Reload systemd when nginx internal-sub drop-in changes
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - nginx_internal_sub_enabled | bool
    - (ansible_facts.service_mgr | default('systemd')) == 'systemd'
    - nginx_internal_sub_dropin is changed
    - not ansible_check_mode
  tags: [deploy, services, nginx, nginx_site_config, phase4]

- name: Check if /etc/cloud/cloud.cfg.d exists on host
  become: true
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: nginx_cloud_init_dir
  when: nginx_internal_sub_enabled | bool
  tags: [deploy, services, nginx, nginx_site_config, phase4]

- name: Disable cloud-init network re-initialization to protect docker0 bridge IP across reboots
  become: true
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-auroraops-disable-network-config.cfg
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by AuroraOps: prevent cloud-init from flushing docker0 172.17.0.1/16 on boot
      network: {config: disabled}
  when:
    - nginx_internal_sub_enabled | bool
    - nginx_cloud_init_dir.stat.exists | default(false)
  tags: [deploy, services, nginx, nginx_site_config, phase4]
- name: Remove the internal subscription origin site when no longer declared
  become: true
  ansible.builtin.file:
    path: "{{ nginx_internal_sub_conf }}"
    state: absent
  when: not nginx_internal_sub_enabled | bool
  notify: reload nginx
  tags: [deploy, services, nginx, nginx_site_enable, phase4]