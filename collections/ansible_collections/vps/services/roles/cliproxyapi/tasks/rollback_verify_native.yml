---
- name: Collect systemd facts after CLIProxyAPI rollback
  become: true
  ansible.builtin.service_facts:
  tags: [rollback_verify, services, cliproxyapi_native, cliproxyapi_rollback_verify, phase5]

- name: Assert CLIProxyAPI runtime units are absent after rollback
  ansible.builtin.assert:
    that:
      - "'cliproxyapi-native.service' not in ansible_facts.services"
      - "'cliproxyapi-restart.service' not in ansible_facts.services"
      - "'cliproxyapi-restart.timer' not in ansible_facts.services"
    fail_msg: "CLIProxyAPI runtime units still exist after rollback"
    success_msg: "CLIProxyAPI runtime units are absent after rollback"
  tags: [rollback_verify, services, cliproxyapi_native, cliproxyapi_rollback_verify, phase5]

- name: Check preserved CLIProxyAPI credential data
  become: true
  ansible.builtin.stat:
    path: "{{ cliproxyapi_data_dir }}"
  register: cliproxyapi_rollback_data
  tags: [rollback_verify, services, cliproxyapi_native, cliproxyapi_rollback_verify, phase5]

- name: Assert CLIProxyAPI credential data survived rollback
  ansible.builtin.assert:
    that:
      - cliproxyapi_rollback_data.stat.exists
      - cliproxyapi_rollback_data.stat.isdir
    fail_msg: "CLIProxyAPI persistent credential data was not preserved"
    success_msg: "CLIProxyAPI persistent credential data was preserved"
  tags: [rollback_verify, services, cliproxyapi_native, cliproxyapi_rollback_verify, phase5]
