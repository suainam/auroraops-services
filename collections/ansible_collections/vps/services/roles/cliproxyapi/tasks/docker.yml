---
# CLIProxyAPI - 使用 container_deployer Meta 角色部署

- name: Check if PostgreSQL is installed for CLIProxyAPI
  ansible.builtin.stat:
    path: /etc/postgresql
  register: cliproxyapi_postgresql_installed
  when: cliproxyapi_docker_use_postgres | bool
  tags: [deploy, services, docker_apps, cliproxyapi, init_db, phase5]

- name: Check if Postgres user exists
  become: true
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - "SELECT 1 FROM pg_roles WHERE rolname='{{ cliproxyapi_docker_pg_user }}'"
  register: docker_apps_cliproxy_user_exists
  changed_when: false
  failed_when: docker_apps_cliproxy_user_exists.rc != 0
  when:
    - cliproxyapi_docker_use_postgres | bool
    - cliproxyapi_postgresql_installed.stat.exists | default(false)
  tags: [deploy, services, docker_apps, cliproxyapi, init_db, phase5]

- name: Create Postgres user
  become: true
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - >-
        CREATE USER {{ cliproxyapi_docker_pg_user }}
        WITH PASSWORD '{{ cliproxyapi_docker_pg_pass }}';
  changed_when: true
  when:
    - cliproxyapi_docker_use_postgres | bool
    - cliproxyapi_postgresql_installed.stat.exists | default(false)
    - docker_apps_cliproxy_user_exists.stdout | default('') | trim != '1'
  no_log: true
  tags: [deploy, services, docker_apps, cliproxyapi, init_db, phase5]

- name: Check if Postgres database exists
  become: true
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -tAc
      - "SELECT 1 FROM pg_database WHERE datname='{{ cliproxyapi_docker_pg_db }}'"
  register: docker_apps_cliproxy_db_exists
  changed_when: false
  failed_when: docker_apps_cliproxy_db_exists.rc != 0
  when:
    - cliproxyapi_docker_use_postgres | bool
    - cliproxyapi_postgresql_installed.stat.exists | default(false)
  tags: [deploy, services, docker_apps, cliproxyapi, init_db, phase5]

- name: Create Postgres database
  become: true
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - >-
        CREATE DATABASE {{ cliproxyapi_docker_pg_db }}
        OWNER {{ cliproxyapi_docker_pg_user }};
  changed_when: true
  when:
    - cliproxyapi_docker_use_postgres | bool
    - cliproxyapi_postgresql_installed.stat.exists | default(false)
    - docker_apps_cliproxy_db_exists.stdout | default('') | trim != '1'
  tags: [deploy, services, docker_apps, cliproxyapi, init_db, phase5]

- name: Ensure cliproxyapi directory exists
  become: true
  ansible.builtin.file:
    path: /opt/dockers/cliproxyapi
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Ensure CLIProxyAPI OAuth credential directory exists
  become: true
  ansible.builtin.file:
    path: /opt/dockers/cliproxyapi/auths
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [deploy, services, cliproxyapi, cliproxyapi_credentials, phase5]

- name: Synchronize shared CLIProxyAPI credentials
  ansible.builtin.import_tasks: shared_credentials.yml
  tags: [deploy, services, cliproxyapi, cliproxyapi_credentials, phase5]

- name: Load CLIProxyAPI Antigravity model catalog
  ansible.builtin.include_vars:
    file: "{{ role_path }}/files/cliproxyapi_antigravity_models.json"
    name: cliproxyapi_antigravity_catalog
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Validate CLIProxyAPI Antigravity model catalog
  ansible.builtin.assert:
    that:
      - cliproxyapi_antigravity_catalog.models is sequence
      - cliproxyapi_antigravity_catalog.models | length > 0
      - >-
        (
          cliproxyapi_antigravity_catalog.models
          | selectattr('upstream_name', 'equalto', 'gemini-pro-agent')
          | list
          | length
        ) == 1
    fail_msg: >-
      官方 Antigravity 模型目录缺失或不包含 gemini-pro-agent，
      请先运行 make refresh-cliproxyapi-models
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Check whether cliproxyapi config already exists
  become: true
  ansible.builtin.stat:
    path: "{{ cliproxyapi_docker_config_path }}"
  register: cliproxyapi_config
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]


- name: Load full CLIProxyAPI runtime config seed when present
  ansible.builtin.include_vars:
    file: "{{ cliproxyapi_config_seed_file }}"
    name: cliproxyapi_config_seed_vars
  no_log: true
  when:
    - >-
      cliproxyapi_config_seed_file | default('', true) | length > 0
      and query(
        'ansible.builtin.fileglob',
        cliproxyapi_config_seed_file | default('', true)
      ) | length > 0
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Validate CLIProxyAPI API keys
  ansible.builtin.assert:
    that:
      - cliproxyapi_api_keys is sequence
      - cliproxyapi_api_keys is not string
      - cliproxyapi_api_keys | length == 6
      - >-
        (
          cliproxyapi_api_keys
          | select('string')
          | map('trim')
          | reject('equalto', '')
          | list
          | length
        ) == cliproxyapi_api_keys | length
    fail_msg: >-
      CLIProxyAPI API keys must be a non-empty Vault-supplied list of strings.
  no_log: true
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Validate cliproxyapi management key
  ansible.builtin.assert:
    that:
      - cliproxyapi_management_key is defined
      - cliproxyapi_management_key | string | trim | length > 0
    fail_msg: "CLIProxyAPI 管理密钥不能为空，请在 secrets/vault.yml 中设置 cliproxyapi_management_key"
  no_log: true
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Enforce CLIProxyAPI config permissions
  become: true
  no_log: true
  ansible.builtin.file:
    path: "{{ cliproxyapi_docker_config_path }}"
    state: file
    owner: root
    group: root
    mode: '0600'
  when: cliproxyapi_config.stat.exists
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Read CLIProxyAPI config before alias migration
  become: true
  no_log: true
  ansible.builtin.slurp:
    src: "{{ cliproxyapi_docker_config_path }}"
  register: cliproxyapi_config_contents
  when: cliproxyapi_config.stat.exists
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Reconcile shared CLIProxyAPI OpenAI Provider block
  become: true
  no_log: true
  diff: false
  ansible.builtin.replace:
    path: "{{ cliproxyapi_docker_config_path }}"
    # The terminating lookahead must identify a real top-level key: a plain
    # identifier at column 0. List items (`- api-key-entries:`) and comments are
    # not keys, and the match must not run past them into the rest of the file.
    # The managed Antigravity alias block is appended at EOF, so its BEGIN marker
    # is also a terminator — otherwise, on a config where `openai-compatibility`
    # is the last key, the marker would be swallowed and blockinfile would append
    # a duplicate block on every run.
    regexp: '(?ms)^openai-compatibility:\n.*?(?=^(?!-\s|#)[A-Za-z0-9_][A-Za-z0-9_.-]*:|^# BEGIN AuroraOps|\Z)'
    replace: "{{ lookup('template', 'cliproxyapi_openai_compatibility.yaml.j2') }}"
  when:
    - cliproxyapi_config.stat.exists
    - cliproxyapi_openai_compatibility is defined
  notify: restart cliproxyapi
  tags: [deploy, services, cliproxyapi, cliproxyapi_config, phase5]

- name: Remove managed CLIProxyAPI Antigravity alias block before reconciliation
  become: true
  no_log: true
  diff: false
  ansible.builtin.replace:
    path: "{{ cliproxyapi_docker_config_path }}"
    regexp: '(?ms)^# BEGIN AuroraOps CLIProxyAPI Antigravity aliases$\n.*?^# END AuroraOps CLIProxyAPI Antigravity aliases\n?'
    replace: ''
  when:
    - cliproxyapi_config.stat.exists
    - >-
      (
        (
          cliproxyapi_config_contents.content
          | b64decode
          | regex_findall('(?m)^oauth-model-alias:')
          | length
        ) != 1
      ) or (
        '# BEGIN AuroraOps CLIProxyAPI Antigravity aliases' not in
        (cliproxyapi_config_contents.content | b64decode)
      )
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Remove unmanaged CLIProxyAPI Antigravity alias blocks
  become: true
  no_log: true
  diff: false
  ansible.builtin.replace:
    path: "{{ cliproxyapi_docker_config_path }}"
    regexp: '(?m)^oauth-model-alias:\n(?:^[ \t][^\n]*(?:\n|$))+'
    replace: ''
  when:
    - cliproxyapi_config.stat.exists
    - >-
      (
        (
          cliproxyapi_config_contents.content
          | b64decode
          | regex_findall('(?m)^oauth-model-alias:')
          | length
        ) != 1
      ) or (
        '# BEGIN AuroraOps CLIProxyAPI Antigravity aliases' not in
        (cliproxyapi_config_contents.content | b64decode)
      )
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Reconcile CLIProxyAPI Antigravity aliases
  become: true
  no_log: true
  diff: false
  ansible.builtin.blockinfile:
    path: "{{ cliproxyapi_docker_config_path }}"
    marker: "# {mark} AuroraOps CLIProxyAPI Antigravity aliases"
    insertafter: EOF
    block: >-
      {{ lookup('template', 'cliproxyapi_antigravity_config.yaml.j2') }}
  when: cliproxyapi_config.stat.exists
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Migrate CLIProxyAPI API keys in existing config
  become: true
  no_log: true
  diff: false
  ansible.builtin.replace:
    path: "{{ cliproxyapi_docker_config_path }}"
    regexp: '(?m)(?:^api-keys:\n(?:  - [^\n]*(?:\n|$))+|^api-keys:[ \t]*\[\][ \t]*$)'
    replace: >-
      {{ 'api-keys:\n'
         ~ lookup('template', 'cliproxyapi_api_keys.yaml.j2') }}
  when: cliproxyapi_config.stat.exists
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Add API keys to existing CLIProxyAPI config without key section
  become: true
  no_log: true
  diff: false
  ansible.builtin.blockinfile:
    path: "{{ cliproxyapi_docker_config_path }}"
    marker: "# {mark} AuroraOps CLIProxyAPI API keys"
    insertafter: EOF
    block: >-
      {{ 'api-keys:\n'
         ~ lookup('template', 'cliproxyapi_api_keys.yaml.j2') }}
  when:
    - cliproxyapi_config.stat.exists
    - >-
      (
        cliproxyapi_config_contents.content
        | b64decode
        | regex_search('(?m)^api-keys:')
      ) is none
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Seed full CLIProxyAPI runtime config when repository seed is available
  become: true
  no_log: true
  diff: false
  ansible.builtin.copy:
    content: >-
      {{
        cliproxyapi_config_seed_vars.cliproxyapi_config_seed
        | to_nice_yaml(indent=2, width=1000)
      }}
    dest: "{{ cliproxyapi_docker_config_path }}"
    owner: root
    mode: '0600'
    force: "{{ cliproxyapi_force_overwrite | bool }}"
  when:
    - cliproxyapi_config_seed_vars is defined
    - cliproxyapi_config_seed_vars.cliproxyapi_config_seed is defined
    # In object-store mode the mirror is shared state with the management UI, so
    # an existing file is only reconciled section by section further up — never
    # overwritten wholesale, because a full seed would drop keys the frontend
    # owns (for example antigravity.sensitive-words). Seeding is bootstrap-only.
    - >-
      (
        (not (cliproxyapi_object_store_active | bool))
        and (cliproxyapi_force_overwrite | bool or not cliproxyapi_config.stat.exists)
      )
      or (
        (cliproxyapi_object_store_active | bool)
        and not cliproxyapi_config.stat.exists
      )
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Seed cliproxyapi config file when absent or force-enabled
  become: true
  no_log: true
  diff: false
  ansible.builtin.template:
    src: cliproxyapi_config.yaml.j2
    dest: "{{ cliproxyapi_docker_config_path }}"
    owner: root
    mode: '0600'
    force: "{{ cliproxyapi_force_overwrite | bool }}"
  when:
    # Same bootstrap-only rule as the seed copy above: never clobber an existing
    # object-store mirror, which the management UI also writes to.
    - >-
      (
        (not (cliproxyapi_object_store_active | bool))
        and (cliproxyapi_force_overwrite | bool or not cliproxyapi_config.stat.exists)
      )
      or (
        (cliproxyapi_object_store_active | bool)
        and not cliproxyapi_config.stat.exists
      )
    - >-
      cliproxyapi_config_seed_vars is not defined
      or cliproxyapi_config_seed_vars.cliproxyapi_config_seed is not defined
  notify: restart cliproxyapi
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Resolve CLIProxyAPI container environment for selected storage mode
  ansible.builtin.set_fact:
    cliproxyapi_container_env: >-
      {{
        {
          'TZ': 'Asia/Shanghai',
          'GOMEMLIMIT': '220MiB',
          'MANAGEMENT_PASSWORD': cliproxyapi_management_key,
          'MANAGEMENT_STATIC_PATH': '/CLIProxyAPI/static/management.html'
        }
        | combine(
            {
              'OBJECTSTORE_ENDPOINT': cliproxyapi_docker_s3_endpoint,
              'OBJECTSTORE_BUCKET': cliproxyapi_docker_s3_bucket,
              'OBJECTSTORE_ACCESS_KEY': cliproxyapi_docker_s3_access_key,
              'OBJECTSTORE_SECRET_KEY': cliproxyapi_docker_s3_secret_key,
              'OBJECTSTORE_LOCAL_PATH': cliproxyapi_docker_s3_local_path
            }
            if (cliproxyapi_object_store_active | bool)
            else (
              {
                'PGSTORE_DSN':
                  'postgresql://'
                  ~ cliproxyapi_docker_pg_user
                  ~ ':'
                  ~ (cliproxyapi_docker_pg_pass | urlencode)
                  ~ '@'
                  ~ cliproxyapi_docker_pg_host
                  ~ ':'
                  ~ (cliproxyapi_docker_pg_port | string)
                  ~ '/'
                  ~ cliproxyapi_docker_pg_db
                  ~ '?sslmode=disable'
              }
              if cliproxyapi_docker_use_postgres | bool
              else {}
            )
          )
      }}
  no_log: true
  tags: [deploy, services, cliproxyapi, phase5]
- name: Assert CLIProxyAPI object-store credentials are complete
  become: true
  no_log: true
  ansible.builtin.assert:
    that:
      - >-
        (cliproxyapi_docker_storage_driver != 's3')
        or (
          (cliproxyapi_docker_s3_endpoint | default('') | string | length > 0)
          and (cliproxyapi_docker_s3_bucket | default('') | string | length > 0)
          and (cliproxyapi_docker_s3_access_key | default('') | string | length > 0)
          and (cliproxyapi_docker_s3_secret_key | default('') | string | length > 0)
        )
    fail_msg: >-
      storage_driver is 's3' but the object-store configuration is incomplete.
      Refusing to deploy: an empty endpoint or key would start the container
      against a broken token store, or silently fall back to local files while
      the bind mounts for config.yaml and auths are already dropped.
      Populate cliproxyapi_s3_endpoint / _bucket / _access_key / _secret_key in
      the Vault, or set cliproxyapi_storage_driver to 'file'.
  tags: [deploy, services, cliproxyapi, phase5]

- name: Deploy cliproxyapi container
  ansible.builtin.include_role:
    name: vps.services.container_deployer
  vars:
    cdp_recreate: "{{ cliproxyapi_force_overwrite | bool }}"
    cdp_name: "cliproxyapi"
    cdp_image: "{{ cliproxyapi_image }}"
    cdp_dirs: ["", "logs", "objectstore"]
    cdp_memory: "{{ cliproxyapi_docker_memory | default('128m') }}"
    cdp_cpus: "0.5"
    cdp_memory_reservation: "{{ cliproxyapi_docker_memory_reservation | default('32m') }}"
    cdp_oom_score_adj: "-300"
    cdp_networks: "{{ cliproxyapi_docker_networks }}"
    cdp_dns: "{{ cliproxyapi_docker_dns }}"
    cdp_ports:
      - "{{ cliproxyapi_docker_bind_address }}:{{ cliproxyapi_docker_app_port }}:8317"
    cdp_volumes: >-
      {{
        [
          "/opt/dockers/cliproxyapi/logs:/CLIProxyAPI/logs"
        ]
        + (
          [
            "/opt/dockers/cliproxyapi/objectstore:/CLIProxyAPI/objectstore"
          ]
          if (cliproxyapi_object_store_active | bool)
          else [
            cliproxyapi_docker_host_config_path ~ ":/CLIProxyAPI/config.yaml",
            "/opt/dockers/cliproxyapi/auths:/root/.cli-proxy-api"
          ]
        )
      }}
    cdp_etc_hosts:
      "host.docker.internal": "host-gateway"
    cdp_env: "{{ cliproxyapi_container_env }}"
    cdp_healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8317'"]
      interval: 1800s
      timeout: 10s
      retries: 3
      start_period: 10s
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Deploy cliproxyapi scheduled restart service
  become: true
  ansible.builtin.template:
    src: cliproxyapi-scheduler-restart.service.j2
    dest: /etc/systemd/system/cliproxyapi-scheduler-restart.service
    owner: root
    group: root
    mode: "0644"
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Deploy cliproxyapi scheduled restart timer
  become: true
  ansible.builtin.template:
    src: cliproxyapi-scheduler-restart.timer.j2
    dest: /etc/systemd/system/cliproxyapi-scheduler-restart.timer
    owner: root
    group: root
    mode: "0644"
  notify: restart cliproxyapi scheduler timer
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]

- name: Enable and start cliproxyapi scheduled restart timer
  become: true
  ansible.builtin.systemd:
    name: cliproxyapi-scheduler-restart.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [deploy, services, docker_apps, cliproxyapi, phase5]
