---
- name: Resolve CLIProxyAPI rollback branch
  ansible.builtin.include_tasks: resolve.yml
  tags: [rollback, services, cliproxyapi, phase5]

- name: Roll back native CLIProxyAPI branch
  ansible.builtin.include_tasks: rollback_native.yml
  when:
    - cliproxyapi_role_enabled | bool
    - cliproxyapi_effective_mode == 'native'

- name: Roll back Docker CLIProxyAPI branch
  ansible.builtin.include_tasks: rollback_docker.yml
  when:
    - cliproxyapi_role_enabled | bool
    - cliproxyapi_effective_mode == 'docker'
