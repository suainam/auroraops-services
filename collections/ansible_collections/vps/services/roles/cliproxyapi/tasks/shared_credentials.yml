---
- name: Load private CLIProxyAPI AI Provider seed
  ansible.builtin.include_vars:
    file: "{{ cliproxyapi_ai_providers_file }}"
  no_log: true
  when:
    - cliproxyapi_ai_providers_file | default('', true) | length > 0
    - query('ansible.builtin.fileglob', cliproxyapi_ai_providers_file | default('', true)) | length > 0
  tags: [deploy, services, cliproxyapi, cliproxyapi_credentials, phase5]

- name: Deploy CLIProxyAPI OAuth credentials from the repository source of truth
  become: true
  no_log: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ cliproxyapi_auth_destination_dir }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0600"
    force: "{{ cliproxyapi_force_overwrite | default(false) | bool }}"
  with_fileglob:
    - "{{ cliproxyapi_auths_dir }}/*.json"
  notify: restart cliproxyapi
  tags: [deploy, services, cliproxyapi, cliproxyapi_credentials, phase5]
