---
- name: Load private CLIProxyAPI AI Provider seed
  ansible.builtin.include_vars:
    file: "{{ cliproxyapi_ai_providers_file }}"
  no_log: true
  when:
    - cliproxyapi_ai_providers_file | default('', true) | length > 0
    - query('ansible.builtin.fileglob', cliproxyapi_ai_providers_file | default('', true)) | length > 0
  tags: [deploy, services, cliproxyapi, cliproxyapi_credentials, phase5]

- name: Assert CLIProxyAPI OAuth credential source is populated
  become: true
  no_log: true
  ansible.builtin.assert:
    that:
      # In file mode the bind-mounted auths dir is the only credential source.
      # An empty glob makes with_fileglob iterate zero times, so the deploy below
      # would silently succeed and the container would come up with no provider
      # credentials — and the bind mount would shadow anything the image had.
      # Object-storage hosts are exempt: there the bucket supplies them.
      - >-
        (cliproxyapi_object_store_active | bool)
        or (
          query('ansible.builtin.fileglob', cliproxyapi_auths_dir ~ '/*.json')
          | length > 0
        )
    fail_msg: >-
      No OAuth credential files matched
      '{{ cliproxyapi_auths_dir }}/*.json'. Refusing to deploy: in file mode the
      container reads credentials from that directory, so an empty glob would
      start it with no providers and no way to recover. Populate the directory,
      point cliproxyapi_auths_dir at the real one, or set
      cliproxyapi_storage_driver to s3.
  tags: [deploy, services, cliproxyapi, cliproxyapi_credentials, phase5]

- name: Deploy CLIProxyAPI OAuth credentials from the repository source of truth
  become: true
  no_log: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ cliproxyapi_auth_destination_dir }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0600"
    force: "{{ cliproxyapi_force_overwrite | default(false) | bool }}"
  with_fileglob:
    - "{{ cliproxyapi_auths_dir }}/*.json"
  notify: restart cliproxyapi
  tags: [deploy, services, cliproxyapi, cliproxyapi_credentials, phase5]
