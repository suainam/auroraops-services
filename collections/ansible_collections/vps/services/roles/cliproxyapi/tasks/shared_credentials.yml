---
- name: Load private CLIProxyAPI AI Provider seed
  ansible.builtin.include_vars:
    file: "{{ cliproxyapi_ai_providers_file }}"
  no_log: true
  when:
    - cliproxyapi_ai_providers_file | default('', true) | length > 0
    - query('ansible.builtin.fileglob', cliproxyapi_ai_providers_file | default('', true)) | length > 0
  tags: [deploy, services, cliproxyapi, cliproxyapi_credentials, phase5]

- name: Assert CLIProxyAPI OAuth credential source is populated
  become: true
  # Deliberately not no_log: the condition and the message contain only a path and
  # a count, and censoring them left the operator with "the output has been hidden"
  # instead of the remediation steps.
  ansible.builtin.assert:
    that:
      # Only the docker branch runs this guard. `cliproxyapi_object_store_active`
      # is derived from `cliproxyapi_docker_storage_driver`, which says nothing in
      # native mode: native has no object store, so setting that driver there
      # would exempt a host that still needs credentials, and the rationale below
      # (a bind mount shadows the image's credentials) does not apply to it either.
      #
      # Within the docker branch: file mode makes the bind-mounted auths
      # directory the only credential source, and an empty glob makes
      # with_fileglob iterate zero times, so the deploy below would silently
      # succeed and the container would start with no providers. Object storage is
      # exempt, because there the bucket supplies them.
      - >-
        (cliproxyapi_effective_mode | default('', true) | lower) != 'docker'
        or (cliproxyapi_object_store_active | bool)
        or (
          query('ansible.builtin.fileglob', cliproxyapi_auths_dir ~ '/*.json')
          | length > 0
        )
    fail_msg: >-
      No OAuth credential files matched
      '{{ cliproxyapi_auths_dir }}/*.json'. Refusing to deploy: in docker file
      mode the container reads credentials from that directory, so an empty glob
      would start it with no providers and no way to recover. Populate the
      directory, point cliproxyapi_auths_dir at the real one, or set
      cliproxyapi_storage_driver to s3.
  tags: [deploy, services, cliproxyapi, cliproxyapi_credentials, phase5]

- name: Deploy CLIProxyAPI OAuth credentials from the repository source of truth
  become: true
  no_log: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ cliproxyapi_auth_destination_dir }}/{{ item | basename }}"
    owner: root
    group: root
    mode: "0600"
    force: "{{ cliproxyapi_force_overwrite | default(false) | bool }}"
  with_fileglob:
    - "{{ cliproxyapi_auths_dir }}/*.json"
  notify: restart cliproxyapi
  tags: [deploy, services, cliproxyapi, cliproxyapi_credentials, phase5]
